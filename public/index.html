  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
    showError("Promise Error: " + reason);
  });
})();

/* ============================= Firestore hooks ============================= */
function useCollection(name, orderByField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let ref = db.collection(name);
    if (orderByField) ref = ref.orderBy(orderByField);
    const unsub = ref.onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, orderByField]);
  return { data, loading };
}

function useQuery(name, field, op, value) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (value === undefined || value === null) { setData([]); setLoading(false); return; }
    const unsub = db.collection(name).where(field, op, value).onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, field, op, value]);
  return { data, loading };
}

function useDoc(collectionName, docId) {
  const [data, setData] = useState(null);
  useEffect(() => {
    const unsub = db.collection(collectionName).doc(docId).onSnapshot(
      (snap) => setData(snap.exists ? snap.data() : null),
      (err) => console.error(err)
    );
    return unsub;
  }, [collectionName, docId]);
  return data;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// Asks the browser for notification permission and saves the resulting push
// subscription on this user's profile. Call this from a button tap (browsers
// require the permission prompt to be triggered by a real user gesture).
async function enablePushNotifications(uid, silent) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    if (!silent) alert("متصفحك ما بيدعم الإشعارات.");
    return false;
  }
  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") { if (!silent) alert("لازم توافق على إذن الإشعارات حتى تفعّل هالميزة."); return false; }
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY_CLIENT),
    });
    await db.collection("users").doc(uid).update({
      pushSubscriptions: firebase.firestore.FieldValue.arrayUnion(subscription.toJSON()),
    });
    return true;
  } catch (err) {
    if (!silent) alert("تعذّر تفعيل الإشعارات: " + err.message);
    return false;
  }
}

// Same idea, but for someone browsing as a GUEST (no account yet) — the

async function enablePushNotificationsGuest() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  if (localStorage.getItem("weinGuestPushSub")) return true; // already captured
  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return false;
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY_CLIENT),
    });
    localStorage.setItem("weinGuestPushSub", JSON.stringify(subscription.toJSON()));

}

// Sends a real push to every device this user enabled notifications on,
// via the Cloudflare Worker relay (fire-and-forget — never blocks the caller).
function sendRealPush(targetUid, title, body) {
  db.collection("users").doc(targetUid).get().then((snap) => {
    const subs = (snap.exists && snap.data().pushSubscriptions) || [];
    subs.forEach((sub) => {
      fetch(PUSH_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Shared-Secret": PUSH_SHARED_SECRET },
        body: JSON.stringify({ subscription: sub, title, body: body || "" }),
      }).catch(() => {});
    });
  }).catch(() => {});
}

function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 700; quality = quality || 0.6;

  function drawAndExport(imgSource, srcWidth, srcHeight) {
    let width = srcWidth, height = srcHeight;
    if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
    else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(imgSource, 0, 0, width, height);
    return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
  }

  // Fast path: createImageBitmap decodes the file directly (no base64
  // round-trip through FileReader), which is noticeably quicker on mobile —
  // especially for the large photos modern phone cameras produce.
  if (window.createImageBitmap) {
    return createImageBitmap(file)
      .then((bitmap) => drawAndExport(bitmap, bitmap.width, bitmap.height))
      .catch(() => compressImageFileLegacy(file, maxDim, quality));
  }
  return compressImageFileLegacy(file, maxDim, quality);
}

function compressImageFileLegacy(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("تعذّر تحميل الصورة"));
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// Converts a Blob (already compressed by compressImageFile) into a base64
// data URL. Used to store small images directly inside Firestore documents
// (QR code, payment proof, product gallery) since Firebase Storage isn't
// enabled on this project yet (needs the paid Blaze plan).
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}
async function fileToCompressedBase64(file, maxDim, quality) {
  const blob = await compressImageFile(file, maxDim, quality);
  return blobToBase64(blob);
}

// Loads an external script on demand (instead of blocking page load with a
// <script> tag in <head>) — used for Leaflet (GPS map) and jsPDF (invoice),
// so that a slow/blocked CDN for those doesn't prevent the whole app from
// loading. Only called when those specific features are actually used.
const _loadedScripts = {};
function loadScriptOnce(src) {
  if (_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("تعذّر تحميل مكتبة: " + src));
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}

// Shared across the whole app via Context — every component that calls
// useLanguage() gets the SAME language value and re-renders together when
// it changes (a plain per-component useState wouldn't do this: toggling the
// language in one place would only update that one component's local copy,
// which is why direction flipped but text didn't change before this fix).
const LanguageContext = createContext(null);
// ===== Automatic whole-page translation (Arabic → English) =====
// Instead of hand-maintaining a dictionary (which misses anything new we
// add later), this walks every visible text node under #root and asks a
// free translation API (MyMemory, no key needed) to translate it, caching
// results in localStorage so repeat visits are instant. A MutationObserver
// keeps watching so any NEW text (switching tabs, live Firestore data,
// future features) gets auto-translated too, with zero code changes needed
// per new string. Translation quality is machine-translated (not as polished
// as hand-written copy) and needs an internet connection to the API the
// first time each string is seen — after that it's cached and instant.
const _translateCache = (() => {
  try { return JSON.parse(localStorage.getItem("weinTranslateCache") || "{}"); } catch (e) { return {}; }
})();
function _saveTranslateCache() {
  try { localStorage.setItem("weinTranslateCache", JSON.stringify(_translateCache)); } catch (e) {}
}
function _hasArabic(text) { return /[\u0600-\u06FF]/.test(text); }
async function _translateOne(text) {
  const key = text.trim();
  if (_translateCache[key]) return _translateCache[key];
  try {
    // MyMemory's free tier caps each request at ~500 bytes; skip longer blocks
    // (they stay Arabic rather than getting cut off mid-sentence).
    if (new Blob([key]).size > 480) return null;
    const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(key) + "&langpair=ar|en");
    const data = await res.json();
    const translated = data && data.responseData && data.responseData.translatedText;
    if (translated && translated.trim()) {
      _translateCache[key] = translated;
      _saveTranslateCache();
      return translated;
    }
  } catch (e) {}
  return null;
}

const _autoTranslateState = { queue: [], running: 0, observer: null, nodeOriginals: new WeakMap() };
function _queueTranslateNode(node) {
  if (!node || node.nodeType !== 3) return;
  const text = node.textContent;
  if (!text || !text.trim() || !_hasArabic(text)) return;
  if (!_autoTranslateState.nodeOriginals.has(node)) _autoTranslateState.nodeOriginals.set(node, text);
  _autoTranslateState.queue.push(node);
  _drainTranslateQueue();
}
function _drainTranslateQueue() {
  while (_autoTranslateState.running < 3 && _autoTranslateState.queue.length) {
    const node = _autoTranslateState.queue.shift();
    _autoTranslateState.running++;
    const original = _autoTranslateState.nodeOriginals.get(node) || node.textContent;
    _translateOne(original).then((translated) => {
      _autoTranslateState.running--;
      // Only apply if the node is still on the page and its text hasn't
      // since been changed to something else by a fresh render.
      if (translated && node.isConnected && node.textContent === original) {
        node.textContent = translated;
      }
      _drainTranslateQueue();
    });
  }
}
function _walkAndQueueTranslate(el) {
  if (!el) return;
  if (el.nodeType === 3) { _queueTranslateNode(el); return; }
  if (el.nodeType !== 1) return;
  const tag = el.tagName;
  if (tag === "SCRIPT" || tag === "STYLE") return;
  for (const child of el.childNodes) _walkAndQueueTranslate(child);
}
function _restoreOriginalText(el) {
  if (!el) return;
  if (el.nodeType === 3) {
    const original = _autoTranslateState.nodeOriginals.get(el);
    if (original != null) el.textContent = original;
    return;
  }
  if (el.nodeType !== 1) return;
  for (const child of el.childNodes) _restoreOriginalText(child);
}
function startAutoTranslate() {
  const root = document.getElementById("root");
  if (!root) return;
  _walkAndQueueTranslate(root);
  if (_autoTranslateState.observer) return;
  const observer = new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (m.type === "characterData") _queueTranslateNode(m.target);
      else if (m.type === "childList") m.addedNodes.forEach((n) => _walkAndQueueTranslate(n));
    }
  });
  observer.observe(root, { childList: true, characterData: true, subtree: true });
  _autoTranslateState.observer = observer;
}
function stopAutoTranslate() {
  if (_autoTranslateState.observer) { _autoTranslateState.observer.disconnect(); _autoTranslateState.observer = null; }
  const root = document.getElementById("root");
  if (root) _restoreOriginalText(root);
  _autoTranslateState.queue = [];
}

function LanguageProvider({ children }) {
  const [lang, setLang] = useState(() => localStorage.getItem("weinLang") || "ar");
  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    localStorage.setItem("weinLang", lang);
    // Give React a moment to finish painting the new screen before scanning it.
    const timer = setTimeout(() => { if (lang === "en") startAutoTranslate(); else stopAutoTranslate(); }, 150);
    return () => clearTimeout(timer);
  }, [lang]);
  const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.ar[key] || key;
  return <LanguageContext.Provider value={[lang, setLang, t]}>{children}</LanguageContext.Provider>;
}
function useLanguage() {
  return useContext(LanguageContext);
}
function LanguageToggle({ dark: darkHeader }) {
  const [lang, setLang] = useLanguage();
  return (
    <button onClick={() => setLang((l) => (l === "ar" ? "en" : "ar"))} style={{ background: "transparent", border: darkHeader ? "1px solid rgba(255,255,255,.3)" : "1px solid #000", color: darkHeader ? "#fff" : "#000", borderRadius: 999, padding: "6px 12px", fontSize: 12, fontWeight: 700 }}>
      {lang === "ar" ? "EN" : "AR"}
    </button>
  );
}

function OrderStepper({ status }) {
  const [lang] = useLanguage();
  const steps = lang === "en" ? [
    ["awaiting_payment_review", "Awaiting payment"],
    ["processing", "Processing"],
    ["out_for_delivery", "On the way"],
    ["delivered", "Delivered"],
  ] : [
    ["awaiting_payment_review", "بانتظار الدفع"],
    ["processing", "قيد التجهيز"],
    ["out_for_delivery", "بالطريق"],
    ["delivered", "وصل"],
  ];
  if (status === "cancelled") return <div style={{ color: "#B23A3A", fontSize: 13, fontWeight: 700 }}>{lang === "en" ? "❌ Order cancelled" : "❌ الطلب ملغى"}</div>;
  const currentIdx = steps.findIndex(([id]) => id === status);
  return (
    <div style={{ display: "flex", alignItems: "center", margin: "10px 0" }}>
      {steps.map(([id, label], i) => (
        <React.Fragment key={id}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
            <div style={{ width: 22, height: 22, borderRadius: "50%", background: i <= currentIdx ? "var(--purple)" : "#eee", color: i <= currentIdx ? "#fff" : "#999", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>{i <= currentIdx ? "✓" : i + 1}</div>
            <div style={{ fontSize: 10, color: i <= currentIdx ? "#000" : "#aaa", marginTop: 4, textAlign: "center" }}>{label}</div>
          </div>
          {i < steps.length - 1 && <div style={{ flex: 1, height: 2, background: i < currentIdx ? "var(--purple)" : "#eee", marginBottom: 16 }}></div>}
        </React.Fragment>
      ))}
    </div>
  );
}

  const [name, setName] = useState("");

  const [password, setPassword] = useState("");
  const [referralCode, setReferralCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [staticPage, setStaticPage] = useState(null);
  const isValidPassword = (pw) => pw.trim().length >= 8;

  const wrapStyle = {
    minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
    background: "radial-gradient(circle at 22% 12%, rgba(155,63,232,.28) 0%, transparent 40%), radial-gradient(circle at 85% 88%, rgba(155,63,232,.16) 0%, transparent 45%), #0A0A0B",

  const handleSocial = async (fn) => {
    setError(""); setBusy(true);
    try { await fn(); } catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };
  const handleSignup = async (e) => {
    e.preventDefault(); setError("");
    if (!name.trim() || !email.trim() || !password.trim()) { setError("عبّي كل الحقول."); return; }
    if (!isValidPassword(password)) { setError("كلمة المرور لازم تكون 8 أحرف/أرقام على الأقل."); return; }
    setBusy(true);
    try { await signup({ email: email.trim(), password, name: name.trim(), referralCode }); }
    catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };
  const handleLogin = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    try { await login({ email: email.trim(), password }); }
    catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };

  return (
    <div style={wrapStyle}>
      <div style={cardStyle} className="fade-in">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          {onBack ? <button onClick={onBack} style={{ background: "transparent", border: "none", color: "var(--muted)", fontSize: 13, cursor: "pointer" }}>{lang === "en" ? "← Back to shop" : "← رجوع للمتجر"}</button> : <span></span>}
          <LanguageToggle />
        </div>
        <div style={{ marginBottom: 6 }}><Logo size={48} /></div>
        <p style={{ textAlign: "center", color: "#9B3FE8", fontWeight: 700, fontSize: 14, marginTop: 0, marginBottom: 22 }}>{t("tagline")}</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          <button type="button" style={{ background: "var(--surface)", color: "#000", border: "1.5px solid #000", borderRadius: 999, padding: 12, fontWeight: 700 }} onClick={() => handleSocial(loginWithGoogle)} disabled={busy}>{t("continueGoogle")}</button>
        </div>
        <div style={{ textAlign: "center", color: "var(--muted)", fontSize: 12, marginBottom: 14 }}>{t("or")}</div>
        <form onSubmit={mode === "login" ? handleLogin : handleSignup} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {mode === "signup" && (
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>{t("fullName")}
              <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} />
            </label>
          )}
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>{t("email")}
            <input type="email" style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} />
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>{t("password")} {mode === "signup" && "(8 أحرف/أرقام على الأقل)"}
            <input type="password" style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} />
          </label>
          {mode === "signup" && (
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>{t("referral")}
              <input style={inputStyle} value={referralCode} onChange={(e) => setReferralCode(e.target.value)} />
            </label>
          )}
          {error && <div style={{ color: "#FF4D4D", fontSize: 13 }}>{error}</div>}
          <button type="submit" style={btnPrimary} disabled={busy}>{busy ? "جارِ التنفيذ…" : mode === "login" ? t("login") : t("signup")}</button>
        </form>
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 13 }}>
          {mode === "login" ? (
            <span>{t("noAccount")} <a href="#" onClick={(e) => { e.preventDefault(); setMode("signup"); setError(""); }} style={{ color: "var(--purple)", fontWeight: 700, textDecoration: "none" }}>{t("createAccount")}</a></span>
          ) : (
            <span>{t("haveAccount")} <a href="#" onClick={(e) => { e.preventDefault(); setMode("login"); setError(""); }} style={{ color: "var(--purple)", fontWeight: 700, textDecoration: "none" }}>{t("loginLink")}</a></span>
          )}
        </div>
        <div style={{ textAlign: "center", marginTop: 18, fontSize: 11, color: "var(--muted)" }}>
          <a href="#" onClick={(e) => { e.preventDefault(); setStaticPage("about"); }} style={{ color: "var(--muted)", textDecoration: "underline", margin: "0 6px" }}>من نحن</a>
          <a href="#" onClick={(e) => { e.preventDefault(); setStaticPage("terms"); }} style={{ color: "var(--muted)", textDecoration: "underline", margin: "0 6px" }}>الشروط والأحكام</a>

        </div>
      </div>
      {staticPage && <StaticPageModal pageId={staticPage} onClose={() => setStaticPage(null)} />}
    </div>
  );
}

        <p style={{ lineHeight: 1.8, color: "#333" }}>{page.body}</p>
        <button onClick={onClose} style={btnGhost}>إغلاق</button>
      </div>
    </div>
  );
}

function RequirePhoneGate({ onSubmit, onLogout }) {
  const [phone, setPhone] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setError("");
    if (!isValidPhone(phone)) { setError("رقم الهاتف غير صحيح. لازم يبدأ بـ 09 ويتكوّن من 10 أرقام (مثال: 0912345678)."); return; }
    setBusy(true);
    try { await onSubmit(phone.trim()); } finally { setBusy(false); }
  };
  return (
    <FullscreenMessage title="خطوة أخيرة" subtitle="لازم رقم هاتف حقيقي على حسابك، حتى لو دخلت عبر Google أو Facebook — التوصيل بحاجته.">
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 320 }}>
        <input style={{ padding: "12px 14px", borderRadius: 9, border: "1px solid #ccc", textAlign: "center" }} placeholder="09xxxxxxxx" value={phone} onChange={(e) => setPhone(e.target.value)} />
        {error && <div style={{ color: "#FF4D4D", fontSize: 13 }}>{error}</div>}
        <button type="submit" style={btnPrimary} disabled={busy}>{busy ? "جارِ الحفظ…" : "متابعة"}</button>
        <button type="button" style={btnGhost} onClick={onLogout}>تسجيل الخروج</button>
      </form>
    </FullscreenMessage>
  );
}

/* ============================= Admin: all products (any merchant) ============================= */
function AllProductsAdmin() {
  const { data: products, loading } = useCollection("products");
  const { data: categories } = useCollection("categories", "name");
  const [search, setSearch] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});

  const filtered = search.trim()
    ? products.filter((p) => (p.name || "").toLowerCase().includes(search.trim().toLowerCase()) || (p.merchantName || "").toLowerCase().includes(search.trim().toLowerCase()))
    : products;

  const startEdit = (p) => {
    setEditingId(p.id);
    setEditForm({ name: p.name, price: String(p.price), stock: String(p.stock), categoryId: p.categoryId || "", description: p.description || "" });
  };
  const saveEdit = async (id) => {
    await db.collection("products").doc(id).update({
      name: editForm.name.trim(), price: Number(editForm.price), stock: Number(editForm.stock) || 0,
      categoryId: editForm.categoryId, description: editForm.description.trim(),
    });
    logAudit("تعديل منتج (أدمن)", editForm.name.trim());
    setEditingId(null);
  };
  const remove = async (p) => {
    if (!window.confirm("متأكد بدك تحذف \"" + p.name + "\" نهائياً؟ (تاجر: " + p.merchantName + ")")) return;
    await db.collection("products").doc(p.id).delete();
    logAudit("حذف منتج (أدمن)", p.name + " — تاجر: " + p.merchantName);
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>كل المنتجات ({products.length})</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>هون تقدر تعدّل أو تحذف منتج أي تاجر — مو بس منتجاتك.</p>
      <input style={{ ...inputStyle, width: "100%", marginBottom: 14 }} placeholder="دور باسم منتج أو اسم تاجر…" value={search} onChange={(e) => setSearch(e.target.value)} />
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map((p) => (
            <div key={p.id} className="lift" style={{ background: "var(--surface)", border: editingId === p.id ? "2px solid var(--purple)" : "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
              {editingId === p.id ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <input style={inputStyle} value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} placeholder="الاسم" />
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <input type="number" style={inputStyle} value={editForm.price} onChange={(e) => setEditForm({ ...editForm, price: e.target.value })} placeholder="السعر" />
                    <input type="number" style={inputStyle} value={editForm.stock} onChange={(e) => setEditForm({ ...editForm, stock: e.target.value })} placeholder="الكمية" />
                  </div>
                  <select style={inputStyle} value={editForm.categoryId} onChange={(e) => setEditForm({ ...editForm, categoryId: e.target.value })}>
                    <option value="">اختر فئة</option>
                    {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <textarea style={{ ...inputStyle, minHeight: 60 }} value={editForm.description} onChange={(e) => setEditForm({ ...editForm, description: e.target.value })} placeholder="الوصف" />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => saveEdit(p.id)} style={btnPrimary}>حفظ</button>
                    <button onClick={() => setEditingId(null)} style={btnGhost}>إلغاء</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    {p.image && <img src={p.image} alt="" style={{ width: 44, height: 44, borderRadius: 8, objectFit: "cover" }} />}
                    <div>
                      <div style={{ fontWeight: 700 }}>{p.name}</div>
                      <div style={{ color: "var(--muted)", fontSize: 12 }}>{p.merchantName} — {p.price} {p.currency} — كمية: {p.stock}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => startEdit(p)} style={btnGhost}>تعديل</button>
                    <button onClick={() => remove(p)} style={btnDanger}>حذف</button>

          ))}
          {filtered.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد منتجات مطابقة.</div>}
        </div>
      )}

  );

/* ============================= Admin: Merchants ============================= */
function MerchantsAdmin() {
  const { createManagedAccount } = useAuth();
  const [, , t] = useLanguage();
  const { data: allUsers, loading } = useCollection("users");
  const merchants = allUsers.filter((u) => u.role === "merchant");
  const [form, setForm] = useState({ name: "", phone: "", email: "", type: "commission", commissionRate: 10, currency: "SYP" });
  const [createdInfo, setCreatedInfo] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});

  const create = async () => {
    setCreatedInfo(null);
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) { setCreatedInfo({ error: "عبّي الاسم ورقم الهاتف والإيميل." }); return; }
    if (!isValidPhone(form.phone)) { setCreatedInfo({ error: "رقم الهاتف غير صحيح." }); return; }
    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({
        email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "merchant",
        extra: { type: form.type, commissionRate: Number(form.commissionRate), currency: form.currency, status: "approved" },
      });
      logAudit("إنشاء حساب تاجر", form.name.trim() + " (" + form.email.trim() + ")");
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "", type: "commission", commissionRate: 10, currency: "SYP" });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };
  const toggleStatus = async (m) => { await db.collection("users").doc(m.id).update({ status: m.status === "approved" ? "suspended" : "approved" }); };
  const resetPassword = async (m) => {
    try { await auth.sendPasswordResetEmail(m.email); alert("انبعث رابط إعادة تعيين كلمة المرور لإيميل التاجر: " + m.email); }
    catch (err) { alert("تعذّر الإرسال: " + err.message); }
  };
  const deleteAccount = async (m) => {
    if (!window.confirm("متأكد بدك تحذف حساب \"" + m.name + "\"؟ هاد بيلغي كل صلاحياته بالتطبيق فوراً، وبيحذف كل منتجاته وبضاعته نهائياً.")) return;
    // Cascade delete: wipe every product belonging to this merchant first,
    // so no orphaned products are left behind pointing at a deleted account.
    const productsSnap = await db.collection("products").where("merchantId", "==", m.id).get();
    await Promise.all(productsSnap.docs.map((doc) => doc.ref.delete()));
    await db.collection("users").doc(m.id).delete();
    logAudit("حذف حساب تاجر", m.name + " (" + m.email + ") — وحذف " + productsSnap.size + " منتج");
  };
  const startEdit = (m) => { setEditingId(m.id); setEditForm({ type: m.type, commissionRate: m.commissionRate || 10, currency: m.currency }); };
  const saveEdit = async (id) => {
    await db.collection("users").doc(id).update({ type: editForm.type, commissionRate: Number(editForm.commissionRate), currency: editForm.currency });
    setEditingId(null);
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>{t("addNewMerchant")}</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder={t("merchantNamePh")} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailForLoginPh")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        <select style={inputStyle} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
          <option value="commission">{t("commissionType")}</option>
          <option value="subscription">{t("subscriptionType")}</option>
        </select>
        {form.type === "commission" && <input type="number" style={inputStyle} placeholder={t("commissionRatePh")} value={form.commissionRate} onChange={(e) => setForm({ ...form, commissionRate: e.target.value })} />}
        <select style={inputStyle} value={form.currency} onChange={(e) => setForm({ ...form, currency: e.target.value })}>
          <option value="SYP">{t("currencySYP")}</option>
          <option value="USD">{t("currencyUSD")}</option>
        </select>
      </div>
      <button onClick={create} disabled={busy} style={btnPrimary}>{busy ? t("creating") : t("createMerchantBtn")}</button>
      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>
          {t("accountCreatedFull")} {t("emailLabel")}: <strong>{createdInfo.email}</strong> / {t("password")}: <strong>{createdInfo.password}</strong>
          <br />{t("handOffNote")}
        </div>
      )}
      {createdInfo && createdInfo.error && <div style={{ color: "red", marginTop: 10 }}>{createdInfo.error}</div>}
      <h2 style={{ marginTop: 32 }}>{t("currentMerchants")}</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {merchants.map((m) => (
            <div key={m.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>{m.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 13 }}>{m.phone} — {m.type === "subscription" ? t("subscriptionType") : t("commissionType") + " " + m.commissionRate + "%"} — {m.currency}</div>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => (editingId === m.id ? setEditingId(null) : startEdit(m))} style={btnGhost}>{editingId === m.id ? t("closeBtn") : t("editBtn")}</button>
                  <button onClick={() => toggleStatus(m)} style={btnGhost}>{m.status === "approved" ? t("deactivate") : t("activate")}</button>
                  <button onClick={() => resetPassword(m)} style={btnGhost}>{t("newPasswordBtn")}</button>
                  <button onClick={() => deleteAccount(m)} style={btnDanger}>{t("deleteAccountBtn")}</button>
                </div>
              </div>
              {editingId === m.id && (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 10, marginTop: 12, paddingTop: 12, borderTop: "1px dashed #ddd" }}>
                  <select style={inputStyle} value={editForm.type} onChange={(e) => setEditForm({ ...editForm, type: e.target.value })}>
                    <option value="commission">{t("commissionType")}</option>
                    <option value="subscription">{t("subscriptionType")}</option>
                  </select>
                  {editForm.type === "commission" && (
                    <input type="number" style={inputStyle} placeholder={t("commissionRatePh")} value={editForm.commissionRate} onChange={(e) => setEditForm({ ...editForm, commissionRate: e.target.value })} />
                  )}
                  <select style={inputStyle} value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })}>
                    <option value="SYP">{t("currencySYP")}</option>
                    <option value="USD">{t("currencyUSD")}</option>
                  </select>
                  <button onClick={() => saveEdit(m.id)} style={btnPrimary}>{t("save")}</button>
                </div>
              )}
            </div>
          ))}
          {merchants.length === 0 && <div style={{ color: "var(--muted)" }}>{t("noMerchantsYet")}</div>}
        </div>
      )}
    </div>
  );
}

/* ============================= Admin: Store settings (exchange rate) ============================= */
function StoreSettingsAdmin() {
  const rate = useExchangeRate();
  const payment = useAdminSettings("payment");
  const whatsapp = useAdminSettings("whatsapp");
  const loyalty = useAdminSettings("loyalty");
  const delivery = useAdminSettings("delivery");
  const referral = useAdminSettings("referral");
  const [value, setValue] = useState("");
  const [msg, setMsg] = useState("");
  const [waNumber, setWaNumber] = useState("");
  const [pointsPerCurrency, setPointsPerCurrency] = useState("1000");
  const [pointValue, setPointValue] = useState("100");
  const [deliveryFee, setDeliveryFee] = useState("0");
  const [freeThreshold, setFreeThreshold] = useState("0");
  const [pricePerKm, setPricePerKm] = useState("0");
  const [referralPoints, setReferralPoints] = useState("100");
  const [qrUploading, setQrUploading] = useState(false);
  useEffect(() => { if (rate) setValue(String(rate)); }, [rate]);
  useEffect(() => { if (whatsapp && whatsapp.number) setWaNumber(whatsapp.number); }, [whatsapp]);
  useEffect(() => { if (loyalty) { if (loyalty.pointsPerCurrency) setPointsPerCurrency(String(loyalty.pointsPerCurrency)); if (loyalty.pointValue) setPointValue(String(loyalty.pointValue)); } }, [loyalty]);
  useEffect(() => { if (delivery) { if (delivery.fee != null) setDeliveryFee(String(delivery.fee)); if (delivery.freeThreshold != null) setFreeThreshold(String(delivery.freeThreshold)); if (delivery.pricePerKm != null) setPricePerKm(String(delivery.pricePerKm)); } }, [delivery]);
  useEffect(() => { if (referral && referral.points) setReferralPoints(String(referral.points)); }, [referral]);

  const save = async () => {
    if (!value || Number(value) <= 0) return;
    await db.collection("settings").doc("exchangeRate").set({ usdToSyp: Number(value) }, { merge: true });
    logAudit("تحديث سعر الصرف", value);
    setMsg("تم الحفظ."); setTimeout(() => setMsg(""), 2000);
  };
  const saveWhatsapp = async () => {
    await db.collection("settings").doc("whatsapp").set({ number: waNumber.trim() }, { merge: true });
    logAudit("تحديث رقم واتساب المنصة", waNumber.trim());
  };
  const saveLoyalty = async () => {
    await db.collection("settings").doc("loyalty").set({ pointsPerCurrency: Number(pointsPerCurrency), pointValue: Number(pointValue) }, { merge: true });
    logAudit("تحديث إعدادات نقاط الولاء", pointsPerCurrency + " / " + pointValue);
  };
  const saveDelivery = async () => {
    await db.collection("settings").doc("delivery").set({ fee: Number(deliveryFee) || 0, freeThreshold: Number(freeThreshold) || 0, pricePerKm: Number(pricePerKm) || 0 }, { merge: true });
    logAudit("تحديث سعر التوصيل", deliveryFee + " / بالكيلومتر: " + pricePerKm + " / حد مجاني: " + freeThreshold);
  };
  const saveReferral = async () => {
    await db.collection("settings").doc("referral").set({ points: Number(referralPoints) || 0 }, { merge: true });
    logAudit("تحديث نقاط الدعوة", referralPoints);
  };
  const uploadQr = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setQrUploading(true);
    try {
      const base64 = await fileToCompressedBase64(file, 500, 0.7);
      await db.collection("settings").doc("payment").set({ shamCashQrImage: base64 }, { merge: true });
      logAudit("تحديث صورة QR شام كاش", "");
    } finally { setQrUploading(false); }
  };
  const toggleCash = async () => {
    await db.collection("settings").doc("payment").set({ cashOnDelivery: !(payment && payment.cashOnDelivery) }, { merge: true });
  };

  return (
    <div style={{ padding: 20, maxWidth: 420 }}>

/* ============================= Admin: Delivery reps ============================= */
const ALL_PERMISSIONS = [
  ["categories", "الفئات"],
  ["merchants", "التجار"],
  ["delivery", "المندوبون"],
  ["orders", "الطلبات"],
  ["cases", "المتابعة وحل الحالات"],
  ["coupons", "الكوبونات"],
  ["reports", "التقارير"],
  ["storesettings", "الإعدادات (سعر الصرف والدفع)"],
  ["returns", "طلبات الإرجاع"],
  ["broadcast", "الإعلانات"],
];

function StaffAdmin() {
  const { createManagedAccount } = useAuth();
  const [, , t] = useLanguage();
  const { data: allUsers, loading } = useCollection("users");
  const staff = allUsers.filter((u) => u.role === "staff");
  const [form, setForm] = useState({ name: "", phone: "", email: "", permissions: [] });
  const [createdInfo, setCreatedInfo] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editPerms, setEditPerms] = useState([]);

  const togglePerm = (list, id, setList) => {
    setList(list.includes(id) ? list.filter((p) => p !== id) : [...list, id]);
  };

  const create = async () => {
    setCreatedInfo(null);
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) { setCreatedInfo({ error: "عبّي كل الحقول." }); return; }
    if (!isValidPhone(form.phone)) { setCreatedInfo({ error: "رقم الهاتف غير صحيح." }); return; }
    if (form.permissions.length === 0) { setCreatedInfo({ error: "اختار صلاحية وحدة عالأقل." }); return; }
    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({
        email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "staff",
        extra: { permissions: form.permissions, status: "active" },
      });
      logAudit("إنشاء حساب موظف", form.name.trim() + " — صلاحيات: " + form.permissions.join(", "));
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "", permissions: [] });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };
  const resetPassword = async (s) => {
    try { await auth.sendPasswordResetEmail(s.email); alert("انبعث رابط إعادة تعيين كلمة المرور لإيميل الموظف: " + s.email); }
    catch (err) { alert("تعذّر الإرسال: " + err.message); }
  };
  const deleteAccount = async (s) => {
    if (!window.confirm("متأكد بدك تحذف حساب \"" + s.name + "\"؟")) return;
    await db.collection("users").doc(s.id).delete();
    logAudit("حذف حساب موظف", s.name + " (" + s.email + ")");
  };
  const startEdit = (s) => { setEditingId(s.id); setEditPerms(s.permissions || []); };
  const saveEdit = async (id) => {
    await db.collection("users").doc(id).update({ permissions: editPerms });
    setEditingId(null);
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>إضافة موظف جديد</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="اسم الموظف" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailLabel")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
      </div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>الصلاحيات — شو يقدر يشوف/يدير هالموظف:</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {ALL_PERMISSIONS.map(([id, label]) => (
            <button
              key={id}
              onClick={() => togglePerm(form.permissions, id, (p) => setForm({ ...form, permissions: p }))}
              style={{ padding: "7px 16px", borderRadius: 999, border: "1px solid var(--border)", background: form.permissions.includes(id) ? "var(--purple)" : "#F0EEE8", color: form.permissions.includes(id) ? "#fff" : "#000" }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
      <button onClick={create} disabled={busy} style={btnPrimary}>{busy ? t("creating") : "إنشاء حساب الموظف"}</button>
      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>
          الإيميل: <strong>{createdInfo.email}</strong> / كلمة المرور: <strong>{createdInfo.password}</strong>
        </div>
      )}
      {createdInfo && createdInfo.error && <div style={{ color: "red", marginTop: 10 }}>{createdInfo.error}</div>}
      <h2 style={{ marginTop: 32 }}>الموظفون الحاليون</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {staff.map((s) => (
            <div key={s.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>{s.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 13 }}>{s.phone} — صلاحيات: {(s.permissions || []).map((p) => (ALL_PERMISSIONS.find((x) => x[0] === p) || [p, p])[1]).join("، ") || "لا شي"}</div>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => (editingId === s.id ? setEditingId(null) : startEdit(s))} style={btnGhost}>{editingId === s.id ? "إغلاق" : "تعديل الصلاحيات"}</button>
                  <button onClick={() => resetPassword(s)} style={btnGhost}>{t("newPasswordBtn")}</button>
                  <button onClick={() => deleteAccount(s)} style={btnDanger}>{t("deleteAccountBtn")}</button>
                </div>
              </div>
              {editingId === s.id && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px dashed #ddd" }}>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                    {ALL_PERMISSIONS.map(([id, label]) => (
                      <button
                        key={id}
                        onClick={() => togglePerm(editPerms, id, setEditPerms)}
                        style={{ padding: "7px 16px", borderRadius: 999, border: "1px solid var(--border)", background: editPerms.includes(id) ? "var(--purple)" : "#F0EEE8", color: editPerms.includes(id) ? "#fff" : "#000" }}
                      >
                        {label}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => saveEdit(s.id)} style={btnPrimary}>حفظ الصلاحيات</button>
                </div>
              )}
            </div>
          ))}
          {staff.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد موظفون بعد.</div>}
        </div>
      )}
    </div>
  );
}

function AuditLogAdmin() {
  const { data: logs, loading } = useCollection("auditLog", "at");
  const sorted = [...logs].reverse();

    <div style={{ padding: 20 }}>
      <h2>سجل النشاط</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {sorted.map((l) => (

              <div style={{ color: "var(--muted)", fontSize: 12, marginTop: 3 }}>بواسطة {l.by} {l.at && l.at.toDate ? "— " + l.at.toDate().toLocaleString("ar") : ""}</div>
            </div>

function OrdersAdmin() {
  const { data: orders, loading } = useCollection("orders");
  const { data: allUsers } = useCollection("users");
  const reps = allUsers.filter((u) => u.role === "delivery" && u.status === "active");
  const confirmPayment = (id, o) => { db.collection("orders").doc(id).update({ status: "processing" }); logAudit("تأكيد دفع طلب", id); notifyUser(o.customerId, "تم تأكيد الدفع", "طلبك #" + id.slice(-5) + " قيد التجهيز الآن."); };
  const assignRep = (id, repId) => db.collection("orders").doc(id).update({ deliveryRepId: repId });
  const sendForDelivery = (id, o) => { db.collection("orders").doc(id).update({ status: "out_for_delivery" }); notifyUser(o.customerId, "طلبك بالطريق", "طلبك #" + id.slice(-5) + " صار مع المندوب."); if (o.deliveryRepId) notifyUser(o.deliveryRepId, "طلب جديد للتوصيل", "أُسند إليك طلب #" + id.slice(-5)); };
  const cancel = (id, o) => { db.collection("orders").doc(id).update({ status: "cancelled" }); logAudit("إلغاء طلب", id); notifyUser(o.customerId, "تم إلغاء طلبك", "طلبك #" + id.slice(-5) + " انلغى."); };

  return (
    <div style={{ padding: 20 }}>
      <h2>الطلبات</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[...orders].reverse().map((o) => (
            <div key={o.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <strong>طلب #{o.id.slice(-5)} — {o.customerName}</strong>
                <StatusTag status={o.status} />
              </div>
              {o.items.map((it, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span>{it.name} × {it.qty}</span><span>{it.price * it.qty}</span>
                </div>
              ))}
              <div style={{ fontWeight: 700, marginTop: 6 }}>الإجمالي: {o.total}</div>
              {o.paymentMethod && <div style={{ fontSize: 12, color: "var(--muted)" }}>طريقة الدفع: {o.paymentMethod === "shamcash" ? "شام كاش" : "نقدي عند الاستلام"}</div>}
              {o.paymentProofImage && (
                <div style={{ marginTop: 6 }}>
                  <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>إثبات التحويل:</div>
                  <img src={o.paymentProofImage} alt="إثبات دفع" onClick={() => window.open(o.paymentProofImage, "_blank")} style={{ width: 80, height: 80, objectFit: "cover", borderRadius: 8, cursor: "pointer", border: "1px solid var(--border)" }} />
                </div>
              )}
              {o.paymentNote && <div style={{ fontSize: 13, color: "var(--muted)" }}>ملاحظة: {o.paymentNote}</div>}
              <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                {o.status === "awaiting_payment_review" && (
                  <React.Fragment>
                    <button onClick={() => confirmPayment(o.id, o)} style={btnPrimary}>تأكيد الدفع</button>
                    <button onClick={() => cancel(o.id, o)} style={btnDanger}>إلغاء</button>
                  </React.Fragment>
                )}
                {o.status === "processing" && (
                  <React.Fragment>
                    <select value={o.deliveryRepId || ""} onChange={(e) => assignRep(o.id, e.target.value)} style={inputStyle}>
                      <option value="">اختر مندوب</option>
                      {reps.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                    </select>
                    <button onClick={() => sendForDelivery(o.id, o)} disabled={!o.deliveryRepId} style={btnPrimary}>إرسال للتوصيل</button>
                  </React.Fragment>
                )}
              </div>
            </div>
          ))}
          {orders.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد طلبات بعد.</div>}
        </div>
      )}
    </div>
  );
}

/* ============================= Shared: dark mode toggle ============================= */
function DarkModeToggle({ dark: darkHeader }) {
  const [dark, setDark] = useDarkMode();
  return (
    <button onClick={() => setDark((d) => !d)} style={{ background: "transparent", border: darkHeader ? "1px solid rgba(255,255,255,.3)" : "1px solid #000", color: darkHeader ? "#fff" : "#000", borderRadius: 999, padding: "6px 12px" }}>
      {dark ? "☀️" : "🌙"}
    </button>
  );

// Straight-line distance between two lat/lng points, in kilometers (haversine formula).
function distanceKm(lat1, lng1, lat2, lng2) {
  const toRad = (d) => (d * Math.PI) / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// A tappable map for picking a real location (merchant's shop, or a
// customer's delivery address) — used to auto-calculate delivery distance.
function LocationPicker({ value, onChange, height }) {
  const mapRef = React.useRef(null);
  const leafletMapRef = React.useRef(null);
  const markerRef = React.useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    loadLeafletCss();
    loadScriptOnce("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js").then(() => setReady(true)).catch(() => {});
  }, []);

  useEffect(() => {
    if (!ready || !mapRef.current || leafletMapRef.current) return;
    const start = value && value.lat ? [value.lat, value.lng] : [33.5138, 36.2765];
    const map = L.map(mapRef.current).setView(start, value && value.lat ? 15 : 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
    const setMarker = (lat, lng) => {
      if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
      else markerRef.current = L.marker([lat, lng], { draggable: true }).addTo(map).on("dragend", (e) => {
        const p = e.target.getLatLng(); onChange({ lat: p.lat, lng: p.lng });
      });
    };
    if (value && value.lat) setMarker(value.lat, value.lng);
    map.on("click", (e) => { setMarker(e.latlng.lat, e.latlng.lng); onChange({ lat: e.latlng.lat, lng: e.latlng.lng }); });
    leafletMapRef.current = map;
  }, [ready]);

  const useMyLocation = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      onChange({ lat: latitude, lng: longitude });
      if (leafletMapRef.current) {
        leafletMapRef.current.setView([latitude, longitude], 16);
        if (markerRef.current) markerRef.current.setLatLng([latitude, longitude]);
        else markerRef.current = L.marker([latitude, longitude], { draggable: true }).addTo(leafletMapRef.current).on("dragend", (e) => {
          const p = e.target.getLatLng(); onChange({ lat: p.lat, lng: p.lng });
        });
      }
    });
  };

  return (
    <div>
      <div ref={mapRef} style={{ width: "100%", height: height || 220, borderRadius: 12, overflow: "hidden", border: "1px solid var(--border)" }}></div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
        <span style={{ fontSize: 12, color: "var(--muted)" }}>دوس على الخريطة أو اسحب العلامة لتحديد الموقع بدقة.</span>
        <button type="button" onClick={useMyLocation} style={{ ...btnGhost, padding: "5px 12px", fontSize: 12 }}>📍 موقعي الحالي</button>
      </div>
    </div>
  );
}

function LiveTrackingMap({ repId }) {
  const rep = useDoc("users", repId);

  const leafletMapRef = React.useRef(null);
  const markerRef = React.useRef(null);

  const [leafletError, setLeafletError] = useState(false);

      senderId: user.uid, senderName: (profile && profile.name) || "", senderRole: (profile && profile.role) || "",
      text: text.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await db.collection("cases").doc(caseId).update({ updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

    setCreatedInfo(null);

        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailLabel")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />

      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>

                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}><span>{name}</span><span>{total}</span></div>
                <div style={{ background: "#eee", borderRadius: 999, height: 8 }}>
                  <div style={{ width: (total / maxMerchantRev * 100) + "%", background: "var(--purple)", height: 8, borderRadius: 999 }}></div>
                </div>
              </div>
            ))}
            {topMerchants.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد بيانات بعد.</div>}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ============================= Admin: returns/exchange requests ============================= */
function ReturnsAdmin() {
  const { data: returns, loading } = useCollection("returns");
  const sorted = [...returns].reverse();
  const setStatus = (r, status) => {
    db.collection("returns").doc(r.id).update({ status });
    logAudit("تحديث طلب إرجاع", r.itemName + " → " + status);
    notifyUser(r.customerId, status === "approved" ? "تم قبول طلب الإرجاع" : "تم رفض طلب الإرجاع", r.itemName);
  };
  const map = { pending: ["قيد المراجعة", "#B58A2A"], approved: ["مقبول", "#1F7A4C"], rejected: ["مرفوض", "#B23A3A"] };
  return (
    <div style={{ padding: 20 }}>
      <h2>طلبات الإرجاع والاستبدال</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {sorted.map((r) => (
            <div key={r.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <strong>{r.itemName}</strong>
                <span style={{ color: (map[r.status] || ["", "#888"])[1], fontSize: 12 }}>{(map[r.status] || [r.status])[0]}</span>
              </div>
              <div style={{ color: "var(--muted)", fontSize: 13 }}>الزبون: {r.customerName} — طلب #{r.orderId.slice(-5)}</div>
              {r.reason && <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>السبب: {r.reason}</div>}
              {r.status === "pending" && (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button onClick={() => setStatus(r, "approved")} style={btnPrimary}>قبول</button>
                  <button onClick={() => setStatus(r, "rejected")} style={btnDanger}>رفض</button>
                </div>
              )}
            </div>
          ))}
          {sorted.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد طلبات إرجاع.</div>}
        </div>
      )}
    </div>
  );
}

/* ============================= Admin: broadcast announcement ============================= */
function BroadcastAdmin() {
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState("");

  const send = async () => {
    if (!title.trim()) return;
    if (!window.confirm("متأكد بدك تبعت هالإعلان لكل الزبائن؟")) return;
    setBusy(true); setResult("");
    try {
      const snap = await db.collection("users").where("role", "==", "customer").get();
      snap.docs.forEach((doc) => notifyUser(doc.id, title.trim(), body.trim()));
      logAudit("بث إعلان لكل الزبائن", title.trim());
      setResult("تم إرسال الإعلان لـ" + snap.docs.length + " زبون. (وصل كإشعار داخل التطبيق للكل، وكإشعار push حقيقي لمين فعّل الإشعارات على جهازه)");
      setTitle(""); setBody("");
    } catch (err) { setResult("حصل خطأ: " + err.message); } finally { setBusy(false); }
  };

  return (
    <div style={{ padding: 20, maxWidth: 420 }}>
      <h2>إرسال إعلان لكل الزبائن</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>مثال: عرض جديد، خصم موسمي، افتتاح متجر جديد… بيوصل فوراً لكل الزبائن دفعة وحدة.</p>
      <input style={{ ...inputStyle, width: "100%", marginBottom: 8 }} placeholder="عنوان الإعلان" value={title} onChange={(e) => setTitle(e.target.value)} />
      <textarea style={{ ...inputStyle, width: "100%", minHeight: 80 }} placeholder="نص الإعلان" value={body} onChange={(e) => setBody(e.target.value)} />
      <button onClick={send} disabled={busy || !title.trim()} style={{ ...btnPrimary, marginTop: 10 }}>{busy ? "جارِ الإرسال…" : "📢 إرسال للجميع"}</button>
      {result && <div style={{ marginTop: 10, color: "#22B573", fontSize: 13 }}>{result}</div>}
    </div>
  );
}

function BackupAdmin() {
  const [busy, setBusy] = useState(false);
  const [wipeBusy, setWipeBusy] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const exportAll = async () => {
    setBusy(true);
    try {
      const collections = ["users", "products", "orders", "categories", "coupons", "returns"];
      const result = {};
      for (const name of collections) {
        const snap = await db.collection(name).get();
        result[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      }
      const blob = new Blob([JSON.stringify(result, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "we-in-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
      logAudit("تصدير نسخة احتياطية", "");
    } finally { setBusy(false); }
  };
  const wipeAllProducts = async () => {
    if (confirmText.trim() !== "حذف الكل") { alert("لازم تكتب \"حذف الكل\" بالضبط بالخانة تحت حتى تتأكد."); return; }
    if (!window.confirm("هاد قرار نهائي وما بيترجع فيه — بدك تحذف كل منتجات كل التجار بالمنصة دفعة وحدة؟")) return;
    setWipeBusy(true);
    try {
      const snap = await db.collection("products").get();
      await Promise.all(snap.docs.map((doc) => doc.ref.delete()));
      logAudit("حذف كل المنتجات دفعة وحدة", snap.size + " منتج");
      alert("تم حذف " + snap.size + " منتج من كل التجار.");
      setConfirmText("");
    } finally { setWipeBusy(false); }
  };
  return (
    <div style={{ padding: 20, maxWidth: 420 }}>
      <h2>نسخة احتياطية</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>بيصدّر ملف JSON فيه كل البيانات (المستخدمين، المنتجات، الطلبات، الفئات، الكوبونات، طلبات الإرجاع) لجهازك مباشرة. خزّنه بمكان آمن، ونفّذها بشكل دوري (مثلاً أسبوعياً).</p>
      <button onClick={exportAll} disabled={busy} style={btnPrimary}>{busy ? "جارِ التصدير…" : "⬇️ تصدير نسخة احتياطية الآن"}</button>

      <h2 style={{ marginTop: 32, color: "#B23A3A" }}>⚠️ حذف كل المنتجات (خطر)</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>بيحذف منتجات <strong>كل التجار</strong> دفعة وحدة نهائياً — قرار ما بيترجع فيه. خذلك نسخة احتياطية فوق قبل ما تستخدمه.</p>
      <input style={{ ...inputStyle, width: "100%", marginBottom: 8 }} placeholder='اكتب "حذف الكل" للتأكيد' value={confirmText} onChange={(e) => setConfirmText(e.target.value)} />
      <button onClick={wipeAllProducts} disabled={wipeBusy} style={btnDanger}>{wipeBusy ? "جارِ الحذف…" : "🗑️ حذف كل المنتجات نهائياً"}</button>
    </div>
  );
}

/* ============================= Admin dashboard shell ============================= */
function ChangePasswordPanel() {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [msg, setMsg] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [pushBusy, setPushBusy] = useState(false);
  const [pushMsg, setPushMsg] = useState("");

  const submit = async () => {
    setError(""); setMsg("");
    if (next.trim().length < 8) { setError("كلمة المرور الجديدة لازم تكون 8 أحرف/أرقام على الأقل."); return; }
    setBusy(true);
    try {
      // Firebase requires a recent login for sensitive actions like changing
      // a password — re-authenticating with the current password first
      // avoids a confusing "requires-recent-login" error.
      const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, current);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(next.trim());
      setMsg("تم تغيير كلمة المرور بنجاح.");
      setCurrent(""); setNext("");
    } catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };

  const enablePush = async () => {
    setPushBusy(true); setPushMsg("");
    const ok = await enablePushNotifications(auth.currentUser.uid);
    if (ok) setPushMsg("تم تفعيل الإشعارات على هالجهاز ✓");
    setPushBusy(false);
  };

  return (
    <div style={{ padding: 20, maxWidth: 380 }}>
      <h2>الإشعارات</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>فعّل إشعارات هالجهاز حتى توصلك تنبيهات حتى لو الموقع/التطبيق مسكّر.</p>
      <button onClick={enablePush} disabled={pushBusy} style={btnPrimary}>{pushBusy ? "جارِ التفعيل…" : "🔔 فعّل الإشعارات على هالجهاز"}</button>
      {pushMsg && <div style={{ color: "#22B573", fontSize: 13, marginTop: 8 }}>{pushMsg}</div>}

      <h2 style={{ marginTop: 32 }}>تغيير كلمة المرور</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <input type="password" style={inputStyle} placeholder="كلمة المرور الحالية" value={current} onChange={(e) => setCurrent(e.target.value)} />
        <input type="password" style={inputStyle} placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)" value={next} onChange={(e) => setNext(e.target.value)} />
        {error && <div style={{ color: "red", fontSize: 13 }}>{error}</div>}
        {msg && <div style={{ color: "#22B573", fontSize: 13 }}>{msg}</div>}
        <button onClick={submit} disabled={busy} style={btnPrimary}>{busy ? "جارِ الحفظ…" : "حفظ كلمة المرور الجديدة"}</button>
      </div>
    </div>
  );
}

/* ============================= Merchant dashboard ============================= */
function MerchantProducts() {
  const { user, profile } = useAuth();
  const { data: products, loading } = useQuery("products", "merchantId", "==", user ? user.uid : null);
  const { data: categories } = useCollection("categories", "name");
  const emptyForm = { name: "", price: "", stock: "", categoryId: "", images: [], description: "", colors: "", sizes: "", flashPrice: "", flashEndsAt: "" };
  const [form, setForm] = useState(emptyForm);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState("");
  const [uploading, setUploading] = useState(false);

  // Images are stored as compressed base64 strings directly in the Firestore
  // document (not Firebase Storage) since Storage needs the paid Blaze plan,
  // which isn't enabled on this project. Up to 4 images per product keeps
  // the document comfortably under Firestore's 1MB document limit.
  const handleImageFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (form.images.length >= 4) { setError("أقصى شي 4 صور لكل منتج."); return; }
    setUploading(true); setError("");
    try {
      const base64 = await fileToCompressedBase64(file, 700, 0.6);
      setForm((f) => ({ ...f, images: [...f.images, base64] }));
    } catch (err) { setError("تعذّرت معالجة الصورة: " + err.message); } finally { setUploading(false); }
  };
  const removeImage = (idx) => setForm((f) => ({ ...f, images: f.images.filter((_, i) => i !== idx) }));

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      name: p.name, price: String(p.price), stock: String(p.stock), categoryId: p.categoryId || "", images: p.images || (p.image ? [p.image] : []), description: p.description || "",
      colors: (p.colors || []).join(", "), sizes: (p.sizes || []).join(", "),
      flashPrice: p.flashSalePrice ? String(p.flashSalePrice) : "",
      flashEndsAt: p.flashSaleEndsAt && p.flashSaleEndsAt.toDate ? p.flashSaleEndsAt.toDate().toISOString().slice(0, 16) : "",
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const cancelEdit = () => { setEditingId(null); setForm(emptyForm); setError(""); };

  const save = async () => {
    setError(""); if (!form.name.trim() || !form.price) return;
    const payload = {
      name: form.name.trim(), price: Number(form.price), currency: (profile && profile.currency) || "SYP",
      stock: Number(form.stock) || 0, categoryId: form.categoryId, images: form.images, image: form.images[0] || "", description: form.description.trim(),
      colors: form.colors.split(",").map((s) => s.trim()).filter(Boolean),
      sizes: form.sizes.split(",").map((s) => s.trim()).filter(Boolean),
      flashSalePrice: form.flashPrice ? Number(form.flashPrice) : null,
      flashSaleEndsAt: form.flashEndsAt ? new Date(form.flashEndsAt) : null,
    };
    try {
      if (editingId) {
        await db.collection("products").doc(editingId).update(payload);
        setEditingId(null);
      } else {
        await db.collection("products").add({
          ...payload, merchantId: user.uid, merchantName: (profile && profile.name) || "",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      setForm(emptyForm);
    } catch (err) { setError("تعذّر الحفظ: " + err.message); }
  };
  const remove = async (id) => {
    if (!window.confirm("متأكد بدك تحذف هالمنتج نهائياً؟")) return;
    await db.collection("products").doc(id).delete();
    if (editingId === id) cancelEdit();
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>{editingId ? "تعديل منتج" : "إضافة منتج"}</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="اسم المنتج" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input type="number" style={inputStyle} placeholder="السعر" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
        <input type="number" style={inputStyle} placeholder="الكمية" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} />
        <select style={inputStyle} value={form.categoryId} onChange={(e) => setForm({ ...form, categoryId: e.target.value })}>
          <option value="">اختر فئة</option>
          {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div style={{ marginBottom: 12 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          {form.images.map((img, i) => (
            <div key={i} style={{ position: "relative" }}>
              <img src={img} alt="" style={{ width: 60, height: 60, borderRadius: 8, objectFit: "cover", border: i === 0 ? "2px solid var(--purple)" : "1px solid #ddd" }} />
              <button onClick={() => removeImage(i)} style={{ position: "absolute", top: -6, left: -6, background: "#B23A3A", color: "#fff", border: "none", borderRadius: "50%", width: 18, height: 18, fontSize: 11, lineHeight: 1 }}>×</button>
            </div>
          ))}
        </div>
        {form.images.length < 4 && <input type="file" accept="image/*" onChange={handleImageFile} />}
        {uploading && <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>جارِ معالجة الصورة…</div>}
        <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 4 }}>أول صورة هي صورة الغلاف — حتى 4 صور.</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 12 }}>
        <input style={inputStyle} placeholder="الألوان المتوفرة (مفصولة بفاصلة، اختياري)" value={form.colors} onChange={(e) => setForm({ ...form, colors: e.target.value })} />
        <input style={inputStyle} placeholder="المقاسات المتوفرة (مفصولة بفاصلة، اختياري)" value={form.sizes} onChange={(e) => setForm({ ...form, sizes: e.target.value })} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 12 }}>
        <input type="number" style={inputStyle} placeholder="سعر تخفيض عرض محدود (اختياري)" value={form.flashPrice} onChange={(e) => setForm({ ...form, flashPrice: e.target.value })} />
        <input type="datetime-local" style={inputStyle} placeholder="ينتهي العرض بتاريخ" value={form.flashEndsAt} onChange={(e) => setForm({ ...form, flashEndsAt: e.target.value })} />
      </div>
      <textarea style={{ ...inputStyle, width: "100%", minHeight: 60, marginBottom: 12 }} placeholder="الوصف" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
      <br />
      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={save} style={btnPrimary}>{editingId ? "حفظ التعديلات" : "نشر المنتج"}</button>
        {editingId && <button onClick={cancelEdit} style={btnGhost}>إلغاء التعديل</button>}
      </div>
      {error && <div style={{ color: "red", marginTop: 10 }}>{error}</div>}
      <h2 style={{ marginTop: 32 }}>
        منتجاتي ({products.length})
        {products.filter((p) => p.stock <= 5).length > 0 && (
          <span style={{ marginRight: 10, fontSize: 12, color: "#B58A2A", fontWeight: 400 }}>⚠ {products.filter((p) => p.stock <= 5).length} منتج كميته منخفضة</span>
        )}
      </h2>
      {loading ? <Loading /> : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px,1fr))", gap: 14 }}>
          {products.map((p) => (
            <div key={p.id} className="lift" style={{ background: "var(--surface)", border: editingId === p.id ? "2px solid var(--purple)" : "1px solid #eee", borderRadius: 12, overflow: "hidden", position: "relative" }}>
              {p.stock <= 5 && <span style={{ position: "absolute", top: 6, right: 6, background: "#B58A2A", color: "#fff", fontSize: 10, padding: "2px 8px", borderRadius: 999, fontWeight: 700 }}>كمية قليلة ({p.stock})</span>}
              <div style={{ height: 110, background: "#f4f4f4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "var(--muted)", fontSize: 12 }}>لا صورة</span>}
              </div>
              <div style={{ padding: 10 }}>

function MerchantReports() {
  const { user } = useAuth();
  const { data: orders, loading } = useQuery("orders", "merchantIds", "array-contains", user ? user.uid : null);
  const delivered = orders.filter((o) => o.status === "delivered");
  const myItemsOf = (o) => o.items.filter((it) => it.merchantId === user.uid);
  const revenue = delivered.reduce((s, o) => s + myItemsOf(o).reduce((s2, it) => s2 + it.price * it.qty, 0), 0);
  const productTotals = {};
  delivered.forEach((o) => myItemsOf(o).forEach((it) => { productTotals[it.name] = (productTotals[it.name] || 0) + it.qty; }));
  const topProducts = Object.entries(productTotals).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxQty = topProducts.length ? topProducts[0][1] : 1;
  return (
    <div style={{ padding: 20 }}>
      <h2>تقرير المبيعات</h2>
      {loading ? <Loading /> : (
        <React.Fragment>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
            <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 16, minWidth: 140 }}>
              <div style={{ color: "var(--muted)", fontSize: 12 }}>إجمالي المبيعات المسلّمة</div>
              <div style={{ fontWeight: 800, fontSize: 22, color: "#9B3FE8" }}>{revenue}</div>
            </div>
            <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 16, minWidth: 140 }}>
              <div style={{ color: "var(--muted)", fontSize: 12 }}>عدد الطلبات المسلّمة</div>
              <div style={{ fontWeight: 800, fontSize: 22 }}>{delivered.length}</div>
            </div>
          </div>
          <h3>الأكثر مبيعاً</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {topProducts.map(([name, qty]) => (
              <div key={name}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}><span>{name}</span><span>{qty}</span></div>
                <div style={{ background: "#eee", borderRadius: 999, height: 8 }}>
                  <div style={{ width: (qty / maxQty * 100) + "%", background: "var(--purple)", height: 8, borderRadius: 999 }}></div>
                </div>
              </div>
            ))}
            {topProducts.length === 0 && <div style={{ color: "var(--muted)" }}>لا يوجد مبيعات مسلّمة بعد.</div>}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function MerchantReviews() {
  const { user } = useAuth();
  const { data: products } = useQuery("products", "merchantId", "==", user ? user.uid : null);
  const [reviewsByProduct, setReviewsByProduct] = useState({});
  const [replyDrafts, setReplyDrafts] = useState({});

  useEffect(() => {
    const unsubs = products.map((p) =>
      db.collection("products").doc(p.id).collection("reviews").onSnapshot((snap) => {
        setReviewsByProduct((prev) => ({ ...prev, [p.id]: snap.docs.map((d) => ({ id: d.id, ...d.data() })) }));
      })
    );
    return () => unsubs.forEach((u) => u());
  }, [products.map((p) => p.id).join(",")]);

  const sendReply = async (productId, reviewId) => {
    const text = (replyDrafts[reviewId] || "").trim();
    if (!text) return;
    await db.collection("products").doc(productId).collection("reviews").doc(reviewId).update({ merchantReply: text });
    setReplyDrafts((d) => ({ ...d, [reviewId]: "" }));
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>مراجعات زبائني</h2>
      {products.map((p) => {
        const reviews = reviewsByProduct[p.id] || [];
        if (reviews.length === 0) return null;
        return (
          <div key={p.id} style={{ marginBottom: 20 }}>
            <h3 style={{ marginBottom: 8 }}>{p.name}</h3>
            {reviews.map((r) => (
              <div key={r.id} style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 12, marginBottom: 8 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <strong style={{ fontSize: 13 }}>{r.customerName}</strong>
                  <StarRating value={r.rating} size={13} />
                </div>
                {r.comment && <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>{r.comment}</div>}
                {r.merchantReply ? (
                  <div style={{ background: "var(--bg)", borderRadius: 8, padding: 8, marginTop: 6, fontSize: 12 }}><strong>ردك: </strong>{r.merchantReply}</div>
                ) : (
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <input style={{ ...inputStyle, flex: 1 }} placeholder="اكتب رد…" value={replyDrafts[r.id] || ""} onChange={(e) => setReplyDrafts((d) => ({ ...d, [r.id]: e.target.value }))} />
                    <button onClick={() => sendReply(p.id, r.id)} style={btnGhost}>رد</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      })}
      {products.every((p) => (reviewsByProduct[p.id] || []).length === 0) && <div style={{ color: "var(--muted)" }}>ما في مراجعات على منتجاتك بعد.</div>}
    </div>
  );
}
