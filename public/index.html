function StarRating({ value, size, onRate }) {
  size = size || 16;
  const stars = [1, 2, 3, 4, 5];
  return (
    <span style={{ display: "inline-flex", gap: 2, cursor: onRate ? "pointer" : "default" }}>
      {stars.map((n) => (
        <span key={n} onClick={() => onRate && onRate(n)} style={{ color: n <= Math.round(value || 0) ? "#F5A623" : "#ddd", fontSize: size }}>★</span>
      ))}
    </span>
  );
}

function ReviewsSection({ productId }) {
  const { user, profile } = useAuth();
  const [reviews, setReviews] = useState([]);
  const [myRating, setMyRating] = useState(0);
  const [comment, setComment] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const unsub = db.collection("products").doc(productId).collection("reviews").orderBy("createdAt", "desc").onSnapshot(
      (snap) => setReviews(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {}
    );
    return unsub;
  }, [productId]);

  const submit = async () => {
    if (!myRating || !user) return;
    setBusy(true);
    try {
      await db.collection("products").doc(productId).collection("reviews").doc(user.uid).set({
        rating: myRating, comment: comment.trim(), customerName: (profile && profile.name) || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // Recompute the product's average rating so the storefront can show it without reading all reviews.
      const allSnap = await db.collection("products").doc(productId).collection("reviews").get();
      const all = allSnap.docs.map((d) => d.data());
      const avg = all.reduce((s, r) => s + r.rating, 0) / all.length;
      await db.collection("products").doc(productId).update({ avgRating: avg, reviewCount: all.length });
      setComment("");
    } finally { setBusy(false); }
  };

  return (
    <div style={{ marginTop: 16, borderTop: "1px solid #eee", paddingTop: 14 }}>
      <h3 style={{ margin: "0 0 10px" }}>التقييمات ({reviews.length})</h3>
      {user && profile && profile.role === "customer" && (
        <div style={{ marginBottom: 14 }}>
          <StarRating value={myRating} size={22} onRate={setMyRating} />
          <textarea style={{ ...inputStyle, width: "100%", minHeight: 50, marginTop: 8 }} placeholder="تعليقك (اختياري)" value={comment} onChange={(e) => setComment(e.target.value)} />
          <button onClick={submit} disabled={busy || !myRating} style={{ ...btnPrimary, marginTop: 6 }}>{busy ? "جارِ الحفظ…" : "إرسال تقييمك"}</button>
        </div>
      )}
      {reviews.map((r) => (
        <div key={r.id} style={{ borderTop: "1px dashed #eee", paddingTop: 8, marginTop: 8 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <strong style={{ fontSize: 13 }}>{r.customerName}</strong>
            <StarRating value={r.rating} size={13} />
          </div>
          {r.comment && <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>{r.comment}</div>}
          {r.merchantReply && (
            <div style={{ background: "var(--bg)", borderRadius: 8, padding: 8, marginTop: 6, fontSize: 12 }}>
              <strong>رد التاجر: </strong>{r.merchantReply}
            </div>
          )}
        </div>
      ))}
      {reviews.length === 0 && <div style={{ color: "var(--muted)", fontSize: 13 }}>لا يوجد تقييمات بعد.</div>}
    </div>
  );
}

function ProductDetailModal({ product, onClose, onAdd }) {
  const rate = useExchangeRate();
  const gallery = (product.images && product.images.length) ? product.images : (product.image ? [product.image] : []);
  const [activeImg, setActiveImg] = useState(0);
  const [color, setColor] = useState((product.colors && product.colors[0]) || "");
  const [size, setSize] = useState((product.sizes && product.sizes[0]) || "");

      setVariantError("اختار اللون/المقاس الأول."); return;

    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999, padding: 16 }} onClick={onClose}>

        {gallery.length > 0 && (
          <React.Fragment>
            <img src={gallery[activeImg]} alt="" style={{ width: "100%", height: 200, objectFit: "cover", borderRadius: 12, marginBottom: 8 }} />
            {gallery.length > 1 && (
              <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                {gallery.map((img, i) => (
                  <img key={i} src={img} alt="" onClick={() => setActiveImg(i)} style={{ width: 44, height: 44, objectFit: "cover", borderRadius: 6, cursor: "pointer", border: i === activeImg ? "2px solid var(--purple)" : "1px solid #ddd" }} />
                ))}
              </div>
            )}
          </React.Fragment>
        )}
        <h2 style={{ margin: "0 0 4px" }}>{product.name}</h2>
        <div style={{ color: "var(--muted)", fontSize: 13 }}>{product.merchantName}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "8px 0" }}>
          <StarRating value={product.avgRating || 0} />
          <span style={{ fontSize: 12, color: "var(--muted)" }}>({product.reviewCount || 0})</span>
        </div>
        {isFlashSaleActive(product) ? (
          <div>
            <span style={{ color: "#9B3FE8", fontWeight: 700, fontSize: 18 }}>{product.flashSalePrice} {product.currency}</span>
            <span style={{ color: "var(--muted)", fontSize: 14, textDecoration: "line-through", marginRight: 8 }}>{product.price}</span>

        ) : (
          <div style={{ color: "#9B3FE8", fontWeight: 700, fontSize: 18 }}>{product.price} {product.currency}</div>
        )}
        {rate && altPriceLabel(effectivePrice, product.currency, rate) && <div style={{ color: "var(--muted)", fontSize: 13 }}>≈ {altPriceLabel(effectivePrice, product.currency, rate)}</div>}
        {product.colors && product.colors.length > 0 && (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>اللون:</div>

              {product.colors.map((c) => <button key={c} onClick={() => setColor(c)} style={{ padding: "5px 12px", borderRadius: 999, border: c === color ? "2px solid var(--purple)" : "1px solid #ddd", background: c === color ? "#F5EEFC" : "#fff" }}>{c}</button>)}
            </div>
          </div>
        )}
        {product.sizes && product.sizes.length > 0 && (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>المقاس:</div>

            </div>
          </div>
        )}
        {variantError && <div style={{ color: "red", fontSize: 12, marginTop: 6 }}>{variantError}</div>}
        {product.description && <p style={{ color: "#333", lineHeight: 1.7, marginTop: 10 }}>{product.description}</p>}
        <button onClick={addToCart} style={{ width: "100%", ...btnPrimary, marginTop: 10 }}>أضف للسلة</button>
        <ReviewsSection productId={product.id} />
        <button onClick={onClose} style={{ ...btnGhost, marginTop: 14 }}>إغلاق</button>
      </div>
    </div>
  );
}

function isFlashSaleActive(p) {
  return !!(p.flashSalePrice && p.flashSaleEndsAt && p.flashSaleEndsAt.toDate && p.flashSaleEndsAt.toDate() > new Date());
}
function getEffectivePrice(p) {
  return isFlashSaleActive(p) ? p.flashSalePrice : p.price;
}
function FlashCountdown({ endsAt }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const diff = Math.max(0, endsAt.getTime() - now);
  const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
  if (diff <= 0) return null;
  return <span style={{ color: "#B23A3A", fontWeight: 700, fontSize: 11 }}>⏰ {String(h).padStart(2, "0")}:{String(m).padStart(2, "0")}:{String(s).padStart(2, "0")}</span>;
}

/* ============================= Customer app ============================= */
function Storefront({ onAdd, onSelectMerchant, merchantId }) {
  const { profile, user, refreshProfile } = useAuth();
  const [, , t] = useLanguage();
  const { data: allProducts, loading } = useCollection("products");
  const { data: categories } = useCollection("categories", "name");
  const rate = useExchangeRate();
  const [categoryId, setCategoryId] = useState("all");
  const [search, setSearch] = useState("");
  const [detailProduct, setDetailProduct] = useState(null);
  const products = merchantId ? allProducts.filter((p) => p.merchantId === merchantId) : allProducts;
  let filtered = categoryId === "all" ? products : products.filter((p) => p.categoryId === categoryId);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    filtered = filtered.filter((p) => (p.name || "").toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q));
  }
  const wishlist = (profile && profile.wishlist) || [];
  const toggleWishlist = (e, productId) => {
    e.stopPropagation();
    if (!user) return;
    const op = wishlist.includes(productId) ? firebase.firestore.FieldValue.arrayRemove(productId) : firebase.firestore.FieldValue.arrayUnion(productId);
    db.collection("users").doc(user.uid).update({ wishlist: op }).then(refreshProfile);
  };
  const navBtn = (active) => ({ padding: "8px 16px", borderRadius: 999, border: "1px solid var(--border)", background: active ? "#000" : "#fff", color: active ? "#fff" : "#000", flexShrink: 0 });
  return (
    <div style={{ padding: 20 }}>
      <input
        style={{ ...inputStyle, width: "100%", marginBottom: 14 }}
        placeholder={t("search")}
        value={search}
        onChange={(e) => setSearch(e.target.value)}
      />
      <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 16 }}>
        <button onClick={() => setCategoryId("all")} style={navBtn(categoryId === "all")}>{t("all")}</button>
        {categories.map((c) => <button key={c.id} onClick={() => setCategoryId(c.id)} style={navBtn(categoryId === c.id)}>{c.name}</button>)}
      </div>
      {loading ? <Loading /> : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px,1fr))", gap: 14 }}>
          {filtered.map((p) => (
            <div key={p.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden", cursor: "pointer", position: "relative" }} onClick={() => setDetailProduct(p)}>
              <button onClick={(e) => toggleWishlist(e, p.id)} style={{ position: "absolute", top: 6, left: 6, background: "rgba(255,255,255,.9)", border: "none", borderRadius: 999, width: 28, height: 28, fontSize: 14, zIndex: 2 }}>{wishlist.includes(p.id) ? "❤️" : "🤍"}</button>
              {isFlashSaleActive(p) && <span style={{ position: "absolute", top: 6, right: 6, background: "#B23A3A", color: "#fff", fontSize: 10, fontWeight: 700, borderRadius: 999, padding: "2px 8px", zIndex: 2 }}>عرض محدود</span>}
              <div style={{ height: 110, background: "#f4f4f4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "var(--muted)", fontSize: 12 }}>لا صورة</span>}
              </div>
              <div style={{ padding: 10 }}>
                <div style={{ fontWeight: 700 }}>{p.name}</div>
                <div style={{ color: "var(--muted)", fontSize: 12, textDecoration: onSelectMerchant ? "underline" : "none" }} onClick={(e) => { if (onSelectMerchant) { e.stopPropagation(); onSelectMerchant(p.merchantId, p.merchantName); } }}>{p.merchantName}</div>
                {p.reviewCount > 0 && <div style={{ display: "flex", alignItems: "center", gap: 4 }}><StarRating value={p.avgRating} size={11} /><span style={{ fontSize: 11, color: "var(--muted)" }}>({p.reviewCount})</span></div>}
                {isFlashSaleActive(p) ? (
                  <div>
                    <span style={{ color: "#9B3FE8", fontWeight: 700 }}>{p.flashSalePrice} {p.currency}</span>
                    <span style={{ color: "var(--muted)", fontSize: 12, textDecoration: "line-through", marginRight: 6 }}>{p.price}</span>
                    <div><FlashCountdown endsAt={p.flashSaleEndsAt.toDate()} /></div>
                  </div>
                ) : (
                  <div style={{ color: "#9B3FE8", fontWeight: 700 }}>{p.price} {p.currency}</div>
                )}
                {rate && altPriceLabel(getEffectivePrice(p), p.currency, rate) && <div style={{ color: "var(--muted)", fontSize: 11 }}>≈ {altPriceLabel(getEffectivePrice(p), p.currency, rate)}</div>}
                <button onClick={(e) => { e.stopPropagation(); if ((p.colors && p.colors.length) || (p.sizes && p.sizes.length)) { setDetailProduct(p); } else { onAdd({ ...p, price: getEffectivePrice(p) }); } }} style={{ marginTop: 6, width: "100%", ...btnPrimary, padding: 8 }}>{t("addToCart")}</button>
              </div>
            </div>
          ))}
          {filtered.length === 0 && <div style={{ color: "var(--muted)" }}>{search.trim() ? "ما في نتائج مطابقة." : t("noProducts")}</div>}
        </div>
      )}
      {detailProduct && <ProductDetailModal product={detailProduct} onClose={() => setDetailProduct(null)} onAdd={onAdd} />}
    </div>
  );
}

function CartView({ cart, onUpdateQty, onPlaced, onBack }) {
  const { user, profile, refreshProfile } = useAuth();
  const [, , t] = useLanguage();
  const rate = useExchangeRate();
  const payment = useAdminSettings("payment");
  const whatsapp = useAdminSettings("whatsapp");
  const loyalty = useAdminSettings("loyalty");
  const deliverySettings = useAdminSettings("delivery");
  const savedAddresses = (profile && profile.addresses) || [];
  const myPoints = (profile && profile.points) || 0;
  const [address, setAddress] = useState("");
  const [deliveryLocation, setDeliveryLocation] = useState((profile && profile.lastDeliveryLocation) || null);
  const [merchantLocations, setMerchantLocations] = useState({});
  const [saveAddress, setSaveAddress] = useState(false);
  const [paymentNote, setPaymentNote] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("shamcash");
  const [proofImage, setProofImage] = useState("");
  const [proofUploading, setProofUploading] = useState(false);
  const [usePoints, setUsePoints] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [couponCode, setCouponCode] = useState("");
  const [coupon, setCoupon] = useState(null);
  const [couponMsg, setCouponMsg] = useState("");

  // Fetch each cart merchant's real shop location (once per merchant) so we
  // can auto-calculate delivery distance once the customer picks theirs too.
  useEffect(() => {
    const ids = [...new Set(cart.map((c) => c.merchantId))];
    ids.forEach((id) => {
      if (id in merchantLocations) return;
      db.collection("users").doc(id).get().then((snap) => {
        setMerchantLocations((prev) => ({ ...prev, [id]: (snap.exists && snap.data().storeLocation) || null }));
      }).catch(() => {});
    });
  }, [cart]);

  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const couponDiscount = coupon ? (coupon.type === "percent" ? Math.round(subtotal * coupon.value / 100) : Math.min(coupon.value, subtotal)) : 0;
  const pointValue = (loyalty && loyalty.pointValue) || 0;
  const pointsDiscount = usePoints && pointValue ? Math.min(Math.floor(myPoints / 100) * pointValue, subtotal - couponDiscount) : 0;
  const discount = couponDiscount + pointsDiscount;
  const afterDiscount = subtotal - discount;

  // Distance-based fee: only kicks in when the admin set a per-km price AND
  // the customer picked their location AND we know every cart merchant's
  // real shop location — otherwise it falls back to the flat delivery fee.
  const merchantIds = [...new Set(cart.map((c) => c.merchantId))];
  const knownDistances = merchantIds.map((id) => merchantLocations[id]).filter((loc) => loc && loc.lat);
  const distanceFee = (deliverySettings && deliverySettings.pricePerKm && deliveryLocation && knownDistances.length === merchantIds.length && merchantIds.length > 0)
    ? Math.round((knownDistances.reduce((s, loc) => s + distanceKm(loc.lat, loc.lng, deliveryLocation.lat, deliveryLocation.lng), 0) / knownDistances.length) * deliverySettings.pricePerKm)
    : null;
  const rawFee = distanceFee != null ? distanceFee : ((deliverySettings && deliverySettings.fee) || 0);
  const deliveryFee = rawFee && deliverySettings && deliverySettings.freeThreshold && afterDiscount >= deliverySettings.freeThreshold ? 0 : rawFee;
  const total = afterDiscount + deliveryFee;

  const applyCoupon = async () => {
    setCouponMsg(""); setCoupon(null);
    if (!couponCode.trim()) return;
    try {
      const snap = await db.collection("coupons").doc(couponCode.trim().toUpperCase()).get();
      if (!snap.exists || !snap.data().active) { setCouponMsg("الكود غير صالح."); return; }
      setCoupon(snap.data());
      setCouponMsg("تم تطبيق الخصم ✓");
    } catch (err) { setCouponMsg("تعذّر التحقق من الكود."); }
  };

  const uploadProof = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setProofUploading(true);
    try { setProofImage(await fileToCompressedBase64(file, 700, 0.6)); }
    catch (err) { setError("تعذّرت معالجة الصورة."); }
    finally { setProofUploading(false); }
  };

  const place = async () => {
    setError("");
    if (cart.length === 0) { setError("السلة فارغة."); return; }
    if (!address.trim()) { setError("عبّي عنوان التوصيل."); return; }
    if (paymentMethod === "shamcash" && !proofImage) { setError("ارفق صورة إثبات تحويل شام كاش."); return; }
    setBusy(true);
    try {
      const pointsUsed = usePoints && pointsDiscount > 0 ? Math.floor(pointsDiscount / pointValue) * 100 : 0;
      const orderRef = await db.collection("orders").add({
        customerId: user.uid, customerName: (profile && profile.name) || "", customerPhone: (profile && profile.phone) || "",
        items: cart, merchantIds, subtotal, discount, couponCode: coupon ? coupon.code : null, pointsUsed, deliveryFee, deliveryLocation: deliveryLocation || null, total,
        address: address.trim(), paymentNote: paymentNote.trim(), paymentMethod, paymentProofImage: paymentMethod === "shamcash" ? proofImage : "",
        status: "awaiting_payment_review", deliveryRepId: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      merchantIds.forEach((mid) => notifyUser(mid, "طلب جديد", "وصلك طلب جديد فيه منتجاتك."));
      if (pointsUsed > 0) {
        await db.collection("users").doc(user.uid).update({ points: firebase.firestore.FieldValue.increment(-pointsUsed) });
        refreshProfile();
      }
      if (saveAddress && address.trim() && !savedAddresses.includes(address.trim())) {
        await db.collection("users").doc(user.uid).update({ addresses: firebase.firestore.FieldValue.arrayUnion(address.trim()) });
        refreshProfile();
      }
      if (deliveryLocation) {
        db.collection("users").doc(user.uid).update({ lastDeliveryLocation: deliveryLocation }).catch(() => {});
      }
      // Opens WhatsApp with a pre-filled order confirmation message to the
      // platform's WhatsApp number (set by the admin in settings).
      if (whatsapp && whatsapp.number) {
        const lines = cart.map((c) => "- " + c.name + " × " + c.qty).join("\n");
        const msg = "تأكيد طلب جديد #" + orderRef.id.slice(-5) + "\nالاسم: " + ((profile && profile.name) || "") + "\n" + lines + "\nالإجمالي: " + total + "\nالعنوان: " + address.trim();
        window.open("https://wa.me/" + whatsapp.number.replace(/[^0-9]/g, "") + "?text=" + encodeURIComponent(msg), "_blank");
      }
      onPlaced();
    } catch (err) { setError("تعذّر إرسال الطلب: " + err.message); } finally { setBusy(false); }
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>{t("cart")}</h2>
      {cart.map((c) => (
        <div key={c.cartKey} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 10, padding: 12, marginBottom: 8 }}>
          <div>
            <div style={{ fontWeight: 700 }}>{c.name}{c.variant && <span style={{ color: "var(--muted)", fontWeight: 400, fontSize: 12 }}> ({c.variant})</span>}</div>
            <div style={{ color: "var(--muted)", fontSize: 13 }}>{c.price} {c.currency}{rate && altPriceLabel(c.price, c.currency, rate) && <span> (≈ {altPriceLabel(c.price, c.currency, rate)})</span>}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => onUpdateQty(c.cartKey, c.qty - 1)}>−</button>
            <span>{c.qty}</span>
            <button onClick={() => onUpdateQty(c.cartKey, c.qty + 1)}>+</button>
          </div>
        </div>
      ))}
      {cart.length === 0 && <div style={{ color: "var(--muted)" }}>{t("cartEmpty")}</div>}
      {cart.length > 0 && (
        <React.Fragment>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <input style={{ ...inputStyle, flex: 1 }} placeholder="كود خصم (اختياري)" value={couponCode} onChange={(e) => setCouponCode(e.target.value)} />
            <button onClick={applyCoupon} style={btnGhost}>تطبيق</button>
          </div>
          {couponMsg && <div style={{ fontSize: 13, color: coupon ? "#22B573" : "#B23A3A", marginTop: 4 }}>{couponMsg}</div>}

          {myPoints >= 100 && pointValue > 0 && (
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 10, background: "var(--bg)", borderRadius: 8, padding: 8 }}>
              <input type="checkbox" checked={usePoints} onChange={(e) => setUsePoints(e.target.checked)} />
              استخدم نقاطي ({myPoints} نقطة) — بتوفّر خصم إضافي
            </label>
          )}

          <div style={{ marginTop: 10 }}>
            {discount > 0 && <div style={{ display: "flex", justifyContent: "space-between", color: "var(--muted)", fontSize: 13 }}><span>المجموع الفرعي</span><span>{subtotal}</span></div>}
            {discount > 0 && <div style={{ display: "flex", justifyContent: "space-between", color: "#22B573", fontSize: 13 }}><span>الخصم</span><span>-{discount}</span></div>}
            {deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", color: "var(--muted)", fontSize: 13 }}><span>رسم التوصيل</span><span>{deliveryFee}</span></div>}
            {deliverySettings && deliverySettings.fee > 0 && deliveryFee === 0 && <div style={{ display: "flex", justifyContent: "space-between", color: "#22B573", fontSize: 13 }}><span>التوصيل</span><span>مجاني 🎉</span></div>}
            <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, marginBottom: 16 }}>
              <span>{t("total")}</span><span>{total}</span>
            </div>
          </div>

          <h3 style={{ marginBottom: 8 }}>طريقة الدفع</h3>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button onClick={() => setPaymentMethod("shamcash")} style={{ flex: 1, padding: 10, borderRadius: 10, border: paymentMethod === "shamcash" ? "2px solid var(--purple)" : "1px solid #eee", background: paymentMethod === "shamcash" ? "#F5EEFC" : "#fff" }}>شام كاش</button>
            {payment && payment.cashOnDelivery && (
              <button onClick={() => setPaymentMethod("cash")} style={{ flex: 1, padding: 10, borderRadius: 10, border: paymentMethod === "cash" ? "2px solid var(--purple)" : "1px solid #eee", background: paymentMethod === "cash" ? "#F5EEFC" : "#fff" }}>نقدي عند الاستلام</button>
            )}
          </div>
          {paymentMethod === "shamcash" && (
            <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14, marginBottom: 10 }}>
              {payment && payment.shamCashQrImage ? (
                <div style={{ textAlign: "center" }}>
                  <img src={payment.shamCashQrImage} alt="QR شام كاش" style={{ width: 160, height: 160, objectFit: "contain" }} />
                  <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>حوّل المبلغ عبر شام كاش بمسح الكود، وبعدين ارفق صورة إثبات التحويل تحت.</div>
                </div>
              ) : <div style={{ color: "var(--muted)", fontSize: 13 }}>ما رفع الأدمن صورة QR بعد.</div>}
              <div style={{ marginTop: 10 }}>
                <input type="file" accept="image/*" onChange={uploadProof} />
                {proofUploading && <div style={{ fontSize: 12, color: "var(--muted)" }}>جارِ المعالجة…</div>}
                {proofImage && <img src={proofImage} alt="" style={{ width: 60, height: 60, objectFit: "cover", borderRadius: 8, marginTop: 6 }} />}
              </div>
            </div>
          )}
          {paymentMethod === "cash" && <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 10 }}>💵 رح تحاسب المندوب نقداً وقت التسليم.</div>}

          {savedAddresses.length > 0 && (
            <select style={{ ...inputStyle, width: "100%", marginBottom: 8 }} value="" onChange={(e) => setAddress(e.target.value)}>
              <option value="">اختر عنوان محفوظ…</option>
              {savedAddresses.map((a, i) => <option key={i} value={a}>{a}</option>)}
            </select>
          )}
          <input style={{ ...inputStyle, width: "100%" }} placeholder={t("deliveryAddress")} value={address} onChange={(e) => setAddress(e.target.value)} />
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "var(--muted)", marginTop: 6 }}>
            <input type="checkbox" checked={saveAddress} onChange={(e) => setSaveAddress(e.target.checked)} /> احفظ هالعنوان لطلبات لاحقة
          </label>

          <div style={{ marginTop: 12 }}>
            <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 6 }}>حدد موقعك الحقيقي على الخريطة (بيحسب سعر التوصيل تلقائياً حسب المسافة):</div>
            <LocationPicker value={deliveryLocation} onChange={setDeliveryLocation} height={180} />
            {distanceFee != null && <div style={{ fontSize: 12, color: "#22B573", marginTop: 6 }}>✓ محسوب حسب المسافة: {distanceFee} {(cart[0] && cart[0].currency) || ""}</div>}
            {distanceFee == null && deliveryLocation && <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 6 }}>ما قدرنا نحسب المسافة تلقائياً (التاجر لسا ما حدد موقع متجره) — رح يُطبّق الرسم الثابت.</div>}
          </div>

          <input style={{ ...inputStyle, width: "100%", marginTop: 8 }} placeholder="ملاحظة إضافية (اختياري)" value={paymentNote} onChange={(e) => setPaymentNote(e.target.value)} />
          {error && <div style={{ color: "red", marginTop: 8 }}>{error}</div>}
          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button onClick={onBack} style={btnGhost}>{t("back")}</button>
            <button onClick={place} disabled={busy} style={btnPrimary}>{busy ? "جارِ الإرسال…" : t("confirmOrder")}</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function ReturnRequestButton({ order }) {
  const { user, profile } = useAuth();
  const [open, setOpen] = useState(false);
  const [itemName, setItemName] = useState(order.items[0] ? order.items[0].name : "");
  const [reason, setReason] = useState("");
  const [sent, setSent] = useState(false);
  const [existing, setExisting] = useState(null);
  useEffect(() => {
    if (!user) return;
    // The query must filter on customerId too (not just orderId) so it
    // matches the Firestore security rule shape, or Firestore rejects the
    // whole query as "insufficient permissions" even though this one
    // customer's own return would have been allowed.
    db.collection("returns").where("orderId", "==", order.id).where("customerId", "==", user.uid).limit(1).get().then((snap) => {
      if (!snap.empty) setExisting({ id: snap.docs[0].id, ...snap.docs[0].data() });
    }).catch(() => {});
  }, [order.id, user]);
  const submit = async () => {
    await db.collection("returns").add({
      orderId: order.id, customerId: user.uid, customerName: (profile && profile.name) || "",
      itemName, reason: reason.trim(), status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    setSent(true); setOpen(false);
  };
  if (existing) {
    const map = { pending: ["قيد المراجعة", "#B58A2A"], approved: ["مقبول", "#1F7A4C"], rejected: ["مرفوض", "#B23A3A"] };
    return <div style={{ marginTop: 8, fontSize: 12, color: (map[existing.status] || ["", "#888"])[1] }}>طلب إرجاع/استبدال: {(map[existing.status] || [existing.status])[0]}</div>;
  }
  if (sent) return <div style={{ marginTop: 8, fontSize: 12, color: "#22B573" }}>تم إرسال طلب الإرجاع، بيتراجع قريباً.</div>;
  return (
    <div style={{ marginTop: 8 }}>
      <button onClick={() => setOpen((o) => !o)} style={{ ...btnGhost, fontSize: 12, padding: "6px 12px" }}>{open ? "إلغاء" : "↩️ طلب إرجاع/استبدال"}</button>
      {open && (
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 8, maxWidth: 320 }}>
          <select style={inputStyle} value={itemName} onChange={(e) => setItemName(e.target.value)}>
            {order.items.map((it, i) => <option key={i} value={it.name}>{it.name}</option>)}
          </select>
          <textarea style={{ ...inputStyle, minHeight: 50 }} placeholder="سبب الإرجاع/الاستبدال" value={reason} onChange={(e) => setReason(e.target.value)} />
          <button onClick={submit} style={btnPrimary}>إرسال الطلب</button>
        </div>
      )}
    </div>
  );
}

async function downloadInvoicePdf(order) {
  try {
    await loadScriptOnce("https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js");
  } catch (e) {
    alert("تعذّر تحميل مكتبة إنشاء PDF (تحقق من اتصال الإنترنت).");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text("We-in - Invoice #" + order.id.slice(-5), 14, 18);
  doc.setFontSize(11);
  doc.text("Customer: " + (order.customerName || ""), 14, 30);
  doc.text("Address: " + (order.address || ""), 14, 37);
  doc.text("Payment: " + (order.paymentMethod === "shamcash" ? "Sham Cash" : order.paymentMethod === "cash" ? "Cash on delivery" : "-"), 14, 44);
  let y = 56;
  doc.text("Items:", 14, y); y += 7;
  order.items.forEach((it) => {
    doc.text(it.name + "  x" + it.qty + "   " + (it.price * it.qty) + " " + (it.currency || ""), 16, y);
    y += 7;
  });
  y += 3;
  if (order.discount > 0) { doc.text("Discount: -" + order.discount, 14, y); y += 7; }
  if (order.deliveryFee > 0) { doc.text("Delivery fee: " + order.deliveryFee, 14, y); y += 7; }
  doc.setFontSize(13);
  doc.text("Total: " + order.total, 14, y + 3);
  doc.save("invoice-" + order.id.slice(-5) + ".pdf");
}

function MyOrders() {
  const { user } = useAuth();
  const [, , t] = useLanguage();
  const { data: orders, loading } = useQuery("orders", "customerId", "==", user ? user.uid : null);
  return (

function CustomerApp() {
  const { user, profile, logout } = useAuth();
  const [lang, setLang, t] = useLanguage();
  const [view, setView] = useState("shop");
  const [cart, setCart] = useState(() => {
    // Pick up any items added while browsing as a guest (before logging in).
    const guestCart = loadGuestCart();
    if (guestCart.length > 0) localStorage.removeItem("weinGuestCart");
    return guestCart;
  });
  const [merchantView, setMerchantView] = useState(null); // { id, name }
  const [savedCart, setSavedCart] = useState(null);
  const addToCart = (product) => {
    const cartKey = product.id + "|" + (product.variant || "");
    setCart((prev) => {
      const existing = prev.find((c) => c.cartKey === cartKey);
      if (existing) return prev.map((c) => (c.cartKey === cartKey ? { ...c, qty: c.qty + 1 } : c));
      return [...prev, { cartKey, productId: product.id, name: product.name, price: product.price, currency: product.currency || "SYP", merchantId: product.merchantId, variant: product.variant || null, qty: 1 }];
    });
  };
  const updateQty = (cartKey, qty) => {
    setCart((prev) => (qty <= 0 ? prev.filter((c) => c.cartKey !== cartKey) : prev.map((c) => (c.cartKey === cartKey ? { ...c, qty } : c))));
  };
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);
  const navBtn = (active) => ({ padding: "8px 16px", borderRadius: 999, border: "1px solid var(--border)", background: active ? "#000" : "#fff", color: active ? "#fff" : "#000" });

  // "Abandoned cart" reminder: save the cart to Firestore whenever it
  // changes, so if the person leaves and comes back (same account, any
  // device) we can offer to restore it. This is an in-app reminder only —
  // it can't notify someone who isn't using the app, which would need a
  // scheduled Cloud Function plus push/SMS/email delivery.
  useEffect(() => {
    if (!user) return;
    if (cart.length > 0) db.collection("carts").doc(user.uid).set({ items: cart, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
    else db.collection("carts").doc(user.uid).delete().catch(() => {});
  }, [cart, user]);
  useEffect(() => {
    if (!user) return;
    db.collection("carts").doc(user.uid).get().then((snap) => {
      if (snap.exists && snap.data().items && snap.data().items.length > 0) setSavedCart(snap.data().items);
    });
  }, [user]);
  const restoreCart = () => { setCart(savedCart); setSavedCart(null); setView("cart"); };

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 20px", background: "var(--surface)", borderBottom: "1px solid #eee" }}>
        <div style={{ fontWeight: 800 }}>أهلاً {profile && profile.name}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <LanguageToggle />
          <DarkModeToggle />
          <NotificationBell />
          <button onClick={logout} style={{ border: "1px solid #000", background: "transparent", borderRadius: 999, padding: "6px 14px" }}>{t("logout")}</button>
        </div>
      </div>
      {savedCart && cart.length === 0 && (
        <div style={{ background: "#FFF6E5", borderBottom: "1px solid #F0D9A0", padding: "10px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, flexWrap: "wrap", gap: 8 }}>
          <span>🛒 نسيت أغراض بسلتك من زيارة سابقة.</span>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={restoreCart} style={{ ...btnPrimary, padding: "6px 14px", fontSize: 12 }}>استعادة السلة</button>
            <button onClick={() => setSavedCart(null)} style={{ ...btnGhost, padding: "6px 14px", fontSize: 12 }}>تجاهل</button>
          </div>
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 20px", background: "var(--surface)", overflowX: "auto", gap: 10 }}>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setView("shop"); setMerchantView(null); }} style={navBtn(view === "shop" && !merchantView)}>{t("shop")}</button>
          <button onClick={() => setView("wishlist")} style={navBtn(view === "wishlist")}>{t("wishlist")}</button>
          <button onClick={() => setView("orders")} style={navBtn(view === "orders")}>{t("myOrders")}</button>
          <button onClick={() => setView("cases")} style={navBtn(view === "cases")}>{t("support")}</button>
          <button onClick={() => setView("addresses")} style={navBtn(view === "addresses")}>{t("account")}</button>
        </div>
        <button className="cart-pulse" onClick={() => setView("cart")} style={{ background: "#9B3FE8", color: "#fff", border: "none", borderRadius: 999, padding: "8px 18px", fontWeight: 700, flexShrink: 0 }}>🛒 {t("cart")} ({cartCount})</button>
      </div>
      {merchantView && view === "shop" && <MerchantStoreHeader merchantId={merchantView.id} name={merchantView.name} onBack={() => setMerchantView(null)} />}
      {view === "shop" && <Storefront onAdd={addToCart} onSelectMerchant={(id, name) => setMerchantView({ id, name })} merchantId={merchantView ? merchantView.id : null} />}
      {view === "wishlist" && <WishlistView onAdd={addToCart} />}
      {view === "cart" && <CartView cart={cart} onUpdateQty={updateQty} onPlaced={() => { setCart([]); setView("orders"); }} onBack={() => setView("shop")} />}
      {view === "orders" && <MyOrders />}
      {view === "cases" && <MyCases />}
      {view === "addresses" && <AddressBook />}
    </div>
  );
}

function DeliveryDashboard() {
  const { user, profile, logout } = useAuth();
  const [, , t] = useLanguage();
  const { data: orders, loading } = useQuery("orders", "deliveryRepId", "==", user ? user.uid : null);
  const loyalty = useAdminSettings("loyalty");
  const myOrders = orders.filter((o) => o.status === "out_for_delivery" || o.status === "delivered");
  const hasActiveDelivery = orders.some((o) => o.status === "out_for_delivery");
  const markDelivered = (id, o) => {
    db.collection("orders").doc(id).update({ status: "delivered" });
    notifyUser(o.customerId, "تم توصيل طلبك", "طلبك #" + id.slice(-5) + " توصّل، بالهنا والشفا!");
    // Award loyalty points based on the admin's configured rate.
    if (loyalty && loyalty.pointsPerCurrency > 0) {
      const earned = Math.floor(o.total / loyalty.pointsPerCurrency);
      if (earned > 0) {
        db.collection("users").doc(o.customerId).update({ points: firebase.firestore.FieldValue.increment(earned) });
        notifyUser(o.customerId, "كسبت نقاط ولاء", "كسبت " + earned + " نقطة من هالطلب.");
      }
    }
  };
  const [showSettings, setShowSettings] = useState(false);

  // Shares this rep's live location while they have an active delivery, so
  // customers can see the LiveTrackingMap update in real time.
  useEffect(() => {
    if (!hasActiveDelivery || !navigator.geolocation) return;
    const watchId = navigator.geolocation.watchPosition(
      (pos) => db.collection("users").doc(user.uid).update({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude }, locationAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {}),
      () => {},
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, [hasActiveDelivery, user]);

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", background: "#000", color: "#fff" }}>
        <div style={{ fontWeight: 800 }}>{profile && profile.name} — {t("deliveryInterface")} {hasActiveDelivery && <span style={{ fontSize: 11, color: "#8BE6A8" }}>● {t("sharingLocation")}</span>}</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <LanguageToggle dark={true} />
          <DarkModeToggle dark={true} />
          <NotificationBell dark={true} />
          <button onClick={() => setShowSettings((s) => !s)} style={{ background: "transparent", border: "1px solid rgba(255,255,255,.3)", color: "#fff", borderRadius: 999, padding: "6px 16px" }}>{showSettings ? t("deliveryMyOrders") : t("tabAccount")}</button>
          <button onClick={logout} style={{ background: "transparent", border: "1px solid rgba(255,255,255,.3)", color: "#fff", borderRadius: 999, padding: "6px 16px" }}>{t("logoutFull")}</button>
        </div>
      </div>
      {showSettings ? <ChangePasswordPanel /> : (
      <div style={{ padding: 20 }}>
        <h2>{t("deliveryMyOrders")}</h2>
        {loading ? <Loading /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {myOrders.map((o) => (
              <div key={o.id} className="lift" style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 14 }}>
                <div style={{ fontWeight: 700 }}>طلب #{o.id.slice(-5)}</div>
                <div style={{ color: "var(--muted)", fontSize: 13 }}>{o.customerName} — {o.customerPhone}</div>
                <div style={{ color: "var(--muted)", fontSize: 13 }}>العنوان: {o.address}</div>
                <div style={{ fontWeight: 700, marginTop: 6 }}>{t("total")}: {o.total}</div>

      if (existing) return prev.map((c) => (c.cartKey === cartKey ? { ...c, qty: c.qty + 1 } : c));
      return [...prev, { cartKey, productId: product.id, name: product.name, price: product.price, currency: product.currency || "SYP", merchantId: product.merchantId, variant: product.variant || null, qty: 1 }];

function App() {
  const { user, profile, loading, logout, setMyPhone } = useAuth();
  useEffect(() => { countVisitOnce(); }, []);
  // Ask for notification permission automatically, once, right after the
  // person is signed in — instead of making them dig for a button. Only
  // fires when the browser hasn't been asked before and this account has
  // no saved subscription yet, so it never nags a second time.
  useEffect(() => {
    if (!user || !profile) return;
    if (typeof Notification === "undefined") return;
    claimGuestPushSubscription(user.uid);
    if (Notification.permission !== "denied" && !(profile.pushSubscriptions && profile.pushSubscriptions.length)) {
      enablePushNotifications(user.uid, true);
    }
  }, [user, profile]);
  if (loading) return <FullscreenMessage title="We-in" subtitle="جارِ التحميل…" />;
  if (!user) return <GuestShell />;

  if (profile && !profile.phone) return <RequirePhoneGate onSubmit={setMyPhone} onLogout={logout} />;
  if (profile && profile.role === "admin") return <AdminDashboard onLogout={logout} />;
  if (profile && profile.role === "staff") return <AdminDashboard onLogout={logout} permissions={profile.permissions || []} />;
  if (profile && profile.role === "merchant") return <MerchantDashboard />;
  if (profile && profile.role === "delivery") return <DeliveryDashboard />;
  if (profile && profile.role === "customer") return <CustomerApp />;

  return (
    <FullscreenMessage title={"أهلاً " + ((profile && profile.name) || "")} subtitle={"دورك: " + ((profile && profile.role) || "غير محدد")}>
      <button onClick={logout} style={btnGhost}>تسجيل الخروج</button>
    </FullscreenMessage>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null, info: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { this.setState({ info }); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ position: "fixed", inset: 0, background: "#B23A3A", color: "#fff", padding: 16, fontFamily: "monospace", fontSize: 12, direction: "ltr", textAlign: "left", whiteSpace: "pre-wrap", overflow: "auto", zIndex: 999999 }}>
          RENDER ERROR:{"\n"}{String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
          {this.state.info && this.state.info.componentStack ? "\n\nComponent stack:" + this.state.info.componentStack : ""}
        </div>
      );
    }
    return this.props.children;
  }
}

<script>
  // We transform the JSX manually (instead of letting Babel Standalone
  // auto-scan <script type="text/babel"> tags) so we can force the
  // "classic" JSX runtime explicitly. Newer Babel defaults to the
  // "automatic" runtime, which injects `import { jsx as _jsx } from
  // "react/jsx-runtime"` into the compiled output — and since this isn't
  // loaded as an ES module, that import crashes the whole page with
  // "Cannot use import statement outside a module".
  (function () {
    var source = document.getElementById("app-source").textContent;
