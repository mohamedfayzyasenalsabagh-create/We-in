  function showError(text) {
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B23A3A;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;direction:ltr;text-align:left;white-space:pre-wrap;max-height:50vh;overflow:auto;";
    el.textContent = text;
    var target = document.body || document.documentElement;
    try { target.appendChild(el); } catch (appendErr) { alert(text); }
  }
  window.addEventListener("error", function (e) {
    var msg = e.message ? e.message : "Resource failed to load: " + (e.target && (e.target.src || e.target.href));
    showError("JS Error: " + msg + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
    showError("Promise Error: " + reason);
  });
})();
</script>

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const ref = db.collection("users").doc(u.uid);
        let snap = await ref.get();
        if (!snap.exists) {
          await ref.set({
            name: u.displayName || "",
            email: u.email || "",
            phone: null,
            role: "customer",
            wishlist: [],
            addresses: [],
            points: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          snap = await ref.get();
        }
        setProfile({ id: u.uid, ...snap.data() });
      } else {
        setProfile(null);
      }
      setLoading(false);
    });
    return unsub;
  }, []);

  async function refreshProfile() {
    if (!auth.currentUser) return;
    const snap = await db.collection("users").doc(auth.currentUser.uid).get();
    setProfile(snap.exists ? { id: auth.currentUser.uid, ...snap.data() } : null);
  }

  async function signup({ email, password, name, referralCode }) {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await cred.user.sendEmailVerification();
    const myReferralCode = cred.user.uid.slice(0, 6).toUpperCase();
    let referredBy = null;
    if (referralCode && referralCode.trim()) {
      try {
        const snap = await db.collection("users").where("referralCode", "==", referralCode.trim().toUpperCase()).limit(1).get();
        if (!snap.empty) referredBy = snap.docs[0].id;
      } catch (e) {}
    }
    await db.collection("users").doc(cred.user.uid).set({
      name, email, phone: null, role: "customer", wishlist: [], addresses: [], points: 0,
      referralCode: myReferralCode, referredBy,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    // Award both sides of a successful referral, if a valid code was used.
    if (referredBy) {
      try {
        const refSettings = await db.collection("settings").doc("referral").get();
        const rewardPoints = (refSettings.exists && refSettings.data().points) || 0;
        if (rewardPoints > 0) {
          await db.collection("users").doc(cred.user.uid).update({ points: firebase.firestore.FieldValue.increment(rewardPoints) });
          await db.collection("users").doc(referredBy).update({ points: firebase.firestore.FieldValue.increment(rewardPoints) });
          notifyUser(referredBy, "دعوة ناجحة!", "صديقك سجّل بكودك، كسبت " + rewardPoints + " نقطة.");
        }
      } catch (e) {}
    }
    return cred.user;
  }

  async function login({ email, password }) {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    return cred.user;
  }

  async function socialSignIn(providerName) {
    const provider = providerName === "google" ? new firebase.auth.GoogleAuthProvider() : new firebase.auth.FacebookAuthProvider();
    const cred = await auth.signInWithPopup(provider);
    return cred.user;
  }
  const loginWithGoogle = () => socialSignIn("google");
  const loginWithFacebook = () => socialSignIn("facebook");

  async function setMyPhone(phone) {
    if (!auth.currentUser) return;
    await db.collection("users").doc(auth.currentUser.uid).update({ phone });
    await refreshProfile();
  }

  async function logout() { await auth.signOut(); }
  async function resendVerification() { if (auth.currentUser) await auth.currentUser.sendEmailVerification(); }

  // Creates merchant/delivery/staff accounts without logging the admin out —
  // uses a throwaway secondary Firebase app instance for the creation call.
  async function createManagedAccount({ email, password, name, role, phone, extra = {} }) {
    const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary-" + Date.now());
    try {
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(cred.user.uid).set({
        name, email, phone: phone || null, role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        ...extra,
      });
      return cred.user.uid;
    } finally {
      await secondaryApp.auth().signOut().catch(() => {});
      await secondaryApp.delete().catch(() => {});
    }
  }

  const value = { user, profile, loading, signup, login, loginWithGoogle, loginWithFacebook, setMyPhone, logout, resendVerification, createManagedAccount };
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}

/* ============================= Firestore hooks ============================= */
function useCollection(name, orderByField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let ref = db.collection(name);
    if (orderByField) ref = ref.orderBy(orderByField);
    const unsub = ref.onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, orderByField]);
  return { data, loading };
}

function useQuery(name, field, op, value) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (value === undefined || value === null) { setData([]); setLoading(false); return; }
    const unsub = db.collection(name).where(field, op, value).onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, field, op, value]);
  return { data, loading };
}

function useDoc(collectionName, docId) {
  const [data, setData] = useState(null);
  useEffect(() => {
    const unsub = db.collection(collectionName).doc(docId).onSnapshot(
      (snap) => setData(snap.exists ? snap.data() : null),
      (err) => console.error(err)
    );
    return unsub;
  }, [collectionName, docId]);
  return data;
}

function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 700; quality = quality || 0.6;

  function drawAndExport(imgSource, srcWidth, srcHeight) {
    let width = srcWidth, height = srcHeight;
    if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
    else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(imgSource, 0, 0, width, height);
    return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
  }

  // Fast path: createImageBitmap decodes the file directly (no base64
  // round-trip through FileReader), which is noticeably quicker on mobile —
  // especially for the large photos modern phone cameras produce.
  if (window.createImageBitmap) {
    return createImageBitmap(file)
      .then((bitmap) => drawAndExport(bitmap, bitmap.width, bitmap.height))
      .catch(() => compressImageFileLegacy(file, maxDim, quality));
  }
  return compressImageFileLegacy(file, maxDim, quality);
}

function compressImageFileLegacy(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("تعذّر تحميل الصورة"));
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// Converts a Blob (already compressed by compressImageFile) into a base64
// data URL. Used to store small images directly inside Firestore documents
// (QR code, payment proof, product gallery) since Firebase Storage isn't
// enabled on this project yet (needs the paid Blaze plan).
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}
async function fileToCompressedBase64(file, maxDim, quality) {
  const blob = await compressImageFile(file, maxDim, quality);
  return blobToBase64(blob);
}

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    localStorage.setItem("weinLang", lang);
  }, [lang]);
  const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.ar[key] || key;
  return [lang, setLang, t];
}
function LanguageToggle({ dark: darkHeader }) {
  const [lang, setLang] = useLanguage();
  return (
    <button onClick={() => setLang((l) => (l === "ar" ? "en" : "ar"))} style={{ background: "transparent", border: darkHeader ? "1px solid rgba(255,255,255,.3)" : "1px solid #000", color: darkHeader ? "#fff" : "#000", borderRadius: 999, padding: "6px 12px", fontSize: 12, fontWeight: 700 }}>
      {lang === "ar" ? "EN" : "AR"}
    </button>
  );
}

function OrderStepper({ status }) {
  const [lang] = useLanguage();
  const steps = lang === "en" ? [
    ["awaiting_payment_review", "Awaiting payment"],
    ["processing", "Processing"],
    ["out_for_delivery", "On the way"],
    ["delivered", "Delivered"],
  ] : [
    ["awaiting_payment_review", "بانتظار الدفع"],
    ["processing", "قيد التجهيز"],
    ["out_for_delivery", "بالطريق"],
    ["delivered", "وصل"],
  ];
  if (status === "cancelled") return <div style={{ color: "#B23A3A", fontSize: 13, fontWeight: 700 }}>{lang === "en" ? "❌ Order cancelled" : "❌ الطلب ملغى"}</div>;
  const currentIdx = steps.findIndex(([id]) => id === status);
  return (
    <div style={{ display: "flex", alignItems: "center", margin: "10px 0" }}>
      {steps.map(([id, label], i) => (
        <React.Fragment key={id}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
            <div style={{ width: 22, height: 22, borderRadius: "50%", background: i <= currentIdx ? "var(--purple)" : "#eee", color: i <= currentIdx ? "#fff" : "#999", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>{i <= currentIdx ? "✓" : i + 1}</div>
            <div style={{ fontSize: 10, color: i <= currentIdx ? "#000" : "#aaa", marginTop: 4, textAlign: "center" }}>{label}</div>
          </div>
          {i < steps.length - 1 && <div style={{ flex: 1, height: 2, background: i < currentIdx ? "var(--purple)" : "#eee", marginBottom: 16 }}></div>}
        </React.Fragment>
      ))}
    </div>
  );
}

  const [busy, setBusy] = useState(false);
  const [signedUp, setSignedUp] = useState(false);

    e.preventDefault(); setError(""); setBusy(true);
    try { await login({ email: email.trim(), password }); }
    catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }

  return (

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          <button type="button" style={{ background: "#fff", color: "#000", border: "1.5px solid #000", borderRadius: 999, padding: 12, fontWeight: 700 }} onClick={() => handleSocial(loginWithGoogle)} disabled={busy}>{t("continueGoogle")}</button>
          <button type="button" style={{ background: "#fff", color: "#000", border: "1.5px solid #000", borderRadius: 999, padding: 12, fontWeight: 700 }} onClick={() => handleSocial(loginWithFacebook)} disabled={busy}>{t("continueFacebook")}</button>
        </div>
        <div style={{ textAlign: "center", color: "#999", fontSize: 12, marginBottom: 14 }}>{t("or")}</div>
        <form onSubmit={mode === "login" ? handleLogin : handleSignup} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {mode === "signup" && (
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>{t("fullName")}

    <FullscreenMessage title="خطوة أخيرة" subtitle="لازم رقم هاتف حقيقي على حسابك، حتى لو دخلت عبر Google أو Facebook — التوصيل بحاجته.">

        <button type="button" style={btnGhost} onClick={onLogout}>تسجيل الخروج</button>

  );
}

    setCreatedInfo(null);

    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({
        email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "merchant",
        extra: { type: form.type, commissionRate: Number(form.commissionRate), currency: form.currency, status: "approved" },
      });
      logAudit("إنشاء حساب تاجر", form.name.trim() + " (" + form.email.trim() + ")");
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "", type: "commission", commissionRate: 10, currency: "SYP" });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };

    await db.collection("users").doc(id).update({ type: editForm.type, commissionRate: Number(editForm.commissionRate), currency: editForm.currency });

        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailForLoginPh")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        <select style={inputStyle} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>

          <option value="USD">{t("currencyUSD")}</option>

      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>
          {t("accountCreatedFull")} {t("emailLabel")}: <strong>{createdInfo.email}</strong> / {t("password")}: <strong>{createdInfo.password}</strong>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {merchants.map((m) => (
            <div key={m.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>{m.name}</div>
                  <div style={{ color: "#888", fontSize: 13 }}>{m.phone} — {m.type === "subscription" ? t("subscriptionType") : t("commissionType") + " " + m.commissionRate + "%"} — {m.currency}</div>

                  <button onClick={() => resetPassword(m)} style={btnGhost}>{t("newPasswordBtn")}</button>
                  <button onClick={() => deleteAccount(m)} style={btnDanger}>{t("deleteAccountBtn")}</button>
                </div>
              </div>
              {editingId === m.id && (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 10, marginTop: 12, paddingTop: 12, borderTop: "1px dashed #ddd" }}>
                  <select style={inputStyle} value={editForm.type} onChange={(e) => setEditForm({ ...editForm, type: e.target.value })}>
                    <option value="commission">{t("commissionType")}</option>

                    <option value="SYP">{t("currencySYP")}</option>

                  </select>
                  <button onClick={() => saveEdit(m.id)} style={btnPrimary}>{t("save")}</button>

  );
}

/* ============================= Admin: Coupons ============================= */
function CouponsAdmin() {
  const [, , t] = useLanguage();
  const { data: coupons, loading } = useCollection("coupons");
  const [form, setForm] = useState({ code: "", type: "percent", value: "" });
  const [error, setError] = useState("");
  const add = async () => {
    setError("");
    if (!form.code.trim() || !form.value) { setError("عبّي الكود والقيمة."); return; }
    try {
      await db.collection("coupons").doc(form.code.trim().toUpperCase()).set({
        code: form.code.trim().toUpperCase(), type: form.type, value: Number(form.value), active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      logAudit("إضافة كوبون", form.code.trim().toUpperCase());
      setForm({ code: "", type: "percent", value: "" });
    } catch (err) { setError("تعذّر الحفظ: " + err.message); }
  };
  const toggle = (c) => db.collection("coupons").doc(c.id).update({ active: !c.active });
  const remove = (id) => db.collection("coupons").doc(id).delete();
  return (
    <div style={{ padding: 20 }}>
      <h2>كوبونات الخصم</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="كود الكوبون (مثال: EID20)" value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} />
        <select style={inputStyle} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
          <option value="percent">نسبة %</option>
          <option value="fixed">مبلغ ثابت</option>
        </select>
        <input type="number" style={inputStyle} placeholder={form.type === "percent" ? "النسبة %" : "المبلغ"} value={form.value} onChange={(e) => setForm({ ...form, value: e.target.value })} />
      </div>
      <button onClick={add} style={btnPrimary}>إضافة كوبون</button>
      {error && <div style={{ color: "red", marginTop: 10 }}>{error}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 24 }}>
        {loading ? <Loading /> : coupons.map((c) => (
          <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
            <div>
              <strong>{c.code}</strong> — {c.type === "percent" ? c.value + "%" : c.value + " (مبلغ ثابت)"}
              {!c.active && <span style={{ color: "#B23A3A", marginRight: 10 }}> (موقوف)</span>}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => toggle(c)} style={btnGhost}>{c.active ? t("deactivate") : t("activate")}</button>
              <button onClick={() => remove(c.id)} style={btnDanger}>حذف</button>
            </div>
          </div>
        ))}
        {!loading && coupons.length === 0 && <div style={{ color: "#888" }}>لا يوجد كوبونات بعد.</div>}
      </div>
    </div>
  );
}

/* ============================= Admin: Store settings (exchange rate) ============================= */
function StoreSettingsAdmin() {
  const rate = useExchangeRate();
  const payment = useAdminSettings("payment");
  const whatsapp = useAdminSettings("whatsapp");
  const loyalty = useAdminSettings("loyalty");
  const delivery = useAdminSettings("delivery");
  const referral = useAdminSettings("referral");
  const [value, setValue] = useState("");
  const [msg, setMsg] = useState("");
  const [waNumber, setWaNumber] = useState("");
  const [pointsPerCurrency, setPointsPerCurrency] = useState("1000");
  const [pointValue, setPointValue] = useState("100");
  const [deliveryFee, setDeliveryFee] = useState("0");
  const [freeThreshold, setFreeThreshold] = useState("0");
  const [referralPoints, setReferralPoints] = useState("100");
  const [qrUploading, setQrUploading] = useState(false);
  useEffect(() => { if (rate) setValue(String(rate)); }, [rate]);
  useEffect(() => { if (whatsapp && whatsapp.number) setWaNumber(whatsapp.number); }, [whatsapp]);
  useEffect(() => { if (loyalty) { if (loyalty.pointsPerCurrency) setPointsPerCurrency(String(loyalty.pointsPerCurrency)); if (loyalty.pointValue) setPointValue(String(loyalty.pointValue)); } }, [loyalty]);
  useEffect(() => { if (delivery) { if (delivery.fee != null) setDeliveryFee(String(delivery.fee)); if (delivery.freeThreshold != null) setFreeThreshold(String(delivery.freeThreshold)); } }, [delivery]);
  useEffect(() => { if (referral && referral.points) setReferralPoints(String(referral.points)); }, [referral]);

  const save = async () => {
    if (!value || Number(value) <= 0) return;
    await db.collection("settings").doc("exchangeRate").set({ usdToSyp: Number(value) }, { merge: true });
    logAudit("تحديث سعر الصرف", value);
    setMsg("تم الحفظ."); setTimeout(() => setMsg(""), 2000);
  };
  const saveWhatsapp = async () => {
    await db.collection("settings").doc("whatsapp").set({ number: waNumber.trim() }, { merge: true });
    logAudit("تحديث رقم واتساب المنصة", waNumber.trim());
  };
  const saveLoyalty = async () => {
    await db.collection("settings").doc("loyalty").set({ pointsPerCurrency: Number(pointsPerCurrency), pointValue: Number(pointValue) }, { merge: true });
    logAudit("تحديث إعدادات نقاط الولاء", pointsPerCurrency + " / " + pointValue);
  };
  const saveDelivery = async () => {
    await db.collection("settings").doc("delivery").set({ fee: Number(deliveryFee) || 0, freeThreshold: Number(freeThreshold) || 0 }, { merge: true });
    logAudit("تحديث سعر التوصيل", deliveryFee + " / حد مجاني: " + freeThreshold);
  };
  const saveReferral = async () => {
    await db.collection("settings").doc("referral").set({ points: Number(referralPoints) || 0 }, { merge: true });
    logAudit("تحديث نقاط الدعوة", referralPoints);
  };
  const uploadQr = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setQrUploading(true);
    try {
      const base64 = await fileToCompressedBase64(file, 500, 0.7);
      await db.collection("settings").doc("payment").set({ shamCashQrImage: base64 }, { merge: true });
      logAudit("تحديث صورة QR شام كاش", "");
    } finally { setQrUploading(false); }
  };
  const toggleCash = async () => {
    await db.collection("settings").doc("payment").set({ cashOnDelivery: !(payment && payment.cashOnDelivery) }, { merge: true });
  };

  return (
    <div style={{ padding: 20, maxWidth: 420 }}>
      <h2>سعر الصرف</h2>
      <p style={{ color: "#888", fontSize: 13 }}>كم ليرة سورية تساوي الدولار الواحد؟ هالرقم بينعرض تلقائياً كسعر تقريبي بجانب أي منتج.</p>
      <div style={{ display: "flex", gap: 10 }}>
        <input type="number" style={{ ...inputStyle, flex: 1 }} placeholder="مثال: 15000" value={value} onChange={(e) => setValue(e.target.value)} />
        <button onClick={save} style={btnPrimary}>حفظ</button>
      </div>
      {msg && <div style={{ color: "#22B573", marginTop: 8 }}>{msg}</div>}

      <h2 style={{ marginTop: 32 }}>سعر التوصيل</h2>
      <p style={{ color: "#888", fontSize: 13 }}>رسم توصيل ثابت يضاف لكل طلب، مع حد أدنى للمبلغ يصير فوقه التوصيل مجاني (0 = بلا حد).</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <label style={{ fontSize: 13 }}>رسم التوصيل
          <input type="number" style={{ ...inputStyle, width: "100%" }} value={deliveryFee} onChange={(e) => setDeliveryFee(e.target.value)} />
        </label>
        <label style={{ fontSize: 13 }}>التوصيل مجاني فوق مبلغ (اختياري)
          <input type="number" style={{ ...inputStyle, width: "100%" }} value={freeThreshold} onChange={(e) => setFreeThreshold(e.target.value)} />
        </label>
        <button onClick={saveDelivery} style={btnPrimary}>حفظ</button>
      </div>

      <h2 style={{ marginTop: 32 }}>طرق الدفع</h2>
      <p style={{ color: "#888", fontSize: 13 }}>صورة QR شام كاش تظهر للزبون لما يختار الدفع بشام كاش وقت تأكيد الطلب.</p>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        {payment && payment.shamCashQrImage && <img src={payment.shamCashQrImage} alt="QR" style={{ width: 90, height: 90, borderRadius: 8, border: "1px solid #ddd", objectFit: "contain" }} />}
        <div>
          <input type="file" accept="image/*" onChange={uploadQr} />
          {qrUploading && <div style={{ fontSize: 12, color: "#888" }}>جارِ الرفع…</div>}
        </div>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, fontSize: 13 }}>
        <input type="checkbox" checked={!!(payment && payment.cashOnDelivery)} onChange={toggleCash} /> فعّل الدفع النقدي عند الاستلام (يحاسب الزبون المندوب مباشرة)
      </label>

      <h2 style={{ marginTop: 32 }}>رقم واتساب المنصة</h2>
      <p style={{ color: "#888", fontSize: 13 }}>لما الزبون يأكد طلب، رح ينفتحله واتساب جاهز يبعت فيه تأكيد الطلب لهالرقم (بصيغة دولية بدون +، مثال: 963912345678).</p>
      <div style={{ display: "flex", gap: 10 }}>
        <input style={{ ...inputStyle, flex: 1 }} placeholder="963912345678" value={waNumber} onChange={(e) => setWaNumber(e.target.value)} />
        <button onClick={saveWhatsapp} style={btnPrimary}>حفظ</button>
      </div>

      <h2 style={{ marginTop: 32 }}>نقاط الولاء</h2>
      <p style={{ color: "#888", fontSize: 13 }}>كل كم من المبلغ يكسب الزبون نقطة واحدة، وكل نقطة كم بتساوي كخصم بالسلة؟</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <label style={{ fontSize: 13 }}>نقطة واحدة لكل مبلغ (مثال 1000 = نقطة كل 1000 ل.س من المشتريات)
          <input type="number" style={{ ...inputStyle, width: "100%" }} value={pointsPerCurrency} onChange={(e) => setPointsPerCurrency(e.target.value)} />
        </label>
        <label style={{ fontSize: 13 }}>قيمة كل 100 نقطة كخصم بالسلة
          <input type="number" style={{ ...inputStyle, width: "100%" }} value={pointValue} onChange={(e) => setPointValue(e.target.value)} />
        </label>
        <button onClick={saveLoyalty} style={btnPrimary}>حفظ</button>
      </div>

      <h2 style={{ marginTop: 32 }}>برنامج دعوة الأصدقاء</h2>
      <p style={{ color: "#888", fontSize: 13 }}>كل زبون إله كود دعوة خاص فيه. لما يسجّل زبون جديد بهالكود، الاثنين (الداعي والمدعو) ياخدو نفس عدد النقاط.</p>
      <div style={{ display: "flex", gap: 10 }}>
        <input type="number" style={{ ...inputStyle, flex: 1 }} placeholder="مثال: 100" value={referralPoints} onChange={(e) => setReferralPoints(e.target.value)} />
        <button onClick={saveReferral} style={btnPrimary}>حفظ</button>
      </div>
    </div>
  );
}

/* ============================= Admin: Delivery reps ============================= */
const ALL_PERMISSIONS = [
  ["categories", "الفئات"],
  ["merchants", "التجار"],
  ["delivery", "المندوبون"],
  ["orders", "الطلبات"],
  ["cases", "المتابعة وحل الحالات"],
  ["coupons", "الكوبونات"],
  ["reports", "التقارير"],
  ["storesettings", "الإعدادات (سعر الصرف والدفع)"],
  ["returns", "طلبات الإرجاع"],
];

function StaffAdmin() {
  const { createManagedAccount } = useAuth();
  const [, , t] = useLanguage();
  const { data: allUsers, loading } = useCollection("users");
  const staff = allUsers.filter((u) => u.role === "staff");
  const [form, setForm] = useState({ name: "", phone: "", email: "", permissions: [] });
  const [createdInfo, setCreatedInfo] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editPerms, setEditPerms] = useState([]);

  const togglePerm = (list, id, setList) => {
    setList(list.includes(id) ? list.filter((p) => p !== id) : [...list, id]);
  };

  const create = async () => {
    setCreatedInfo(null);
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) { setCreatedInfo({ error: "عبّي كل الحقول." }); return; }
    if (!isValidPhone(form.phone)) { setCreatedInfo({ error: "رقم الهاتف غير صحيح." }); return; }
    if (form.permissions.length === 0) { setCreatedInfo({ error: "اختار صلاحية وحدة عالأقل." }); return; }
    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({
        email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "staff",
        extra: { permissions: form.permissions, status: "active" },
      });
      logAudit("إنشاء حساب موظف", form.name.trim() + " — صلاحيات: " + form.permissions.join(", "));
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "", permissions: [] });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };
  const resetPassword = async (s) => {
    try { await auth.sendPasswordResetEmail(s.email); alert("انبعث رابط إعادة تعيين كلمة المرور لإيميل الموظف: " + s.email); }
    catch (err) { alert("تعذّر الإرسال: " + err.message); }
  };
  const deleteAccount = async (s) => {
    if (!window.confirm("متأكد بدك تحذف حساب \"" + s.name + "\"؟")) return;
    await db.collection("users").doc(s.id).delete();
    logAudit("حذف حساب موظف", s.name + " (" + s.email + ")");
  };
  const startEdit = (s) => { setEditingId(s.id); setEditPerms(s.permissions || []); };
  const saveEdit = async (id) => {
    await db.collection("users").doc(id).update({ permissions: editPerms });
    setEditingId(null);
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>إضافة موظف جديد</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="اسم الموظف" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailLabel")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
      </div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 13, color: "#888", marginBottom: 8 }}>الصلاحيات — شو يقدر يشوف/يدير هالموظف:</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {ALL_PERMISSIONS.map(([id, label]) => (
            <button
              key={id}
              onClick={() => togglePerm(form.permissions, id, (p) => setForm({ ...form, permissions: p }))}
              style={{ padding: "7px 16px", borderRadius: 999, border: "1px solid #eee", background: form.permissions.includes(id) ? "var(--purple)" : "#F0EEE8", color: form.permissions.includes(id) ? "#fff" : "#000" }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
      <button onClick={create} disabled={busy} style={btnPrimary}>{busy ? t("creating") : "إنشاء حساب الموظف"}</button>
      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>
          الإيميل: <strong>{createdInfo.email}</strong> / كلمة المرور: <strong>{createdInfo.password}</strong>
        </div>
      )}
      {createdInfo && createdInfo.error && <div style={{ color: "red", marginTop: 10 }}>{createdInfo.error}</div>}
      <h2 style={{ marginTop: 32 }}>الموظفون الحاليون</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {staff.map((s) => (
            <div key={s.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>{s.name}</div>
                  <div style={{ color: "#888", fontSize: 13 }}>{s.phone} — صلاحيات: {(s.permissions || []).map((p) => (ALL_PERMISSIONS.find((x) => x[0] === p) || [p, p])[1]).join("، ") || "لا شي"}</div>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => (editingId === s.id ? setEditingId(null) : startEdit(s))} style={btnGhost}>{editingId === s.id ? "إغلاق" : "تعديل الصلاحيات"}</button>
                  <button onClick={() => resetPassword(s)} style={btnGhost}>{t("newPasswordBtn")}</button>
                  <button onClick={() => deleteAccount(s)} style={btnDanger}>{t("deleteAccountBtn")}</button>
                </div>
              </div>
              {editingId === s.id && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px dashed #ddd" }}>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                    {ALL_PERMISSIONS.map(([id, label]) => (
                      <button
                        key={id}
                        onClick={() => togglePerm(editPerms, id, setEditPerms)}
                        style={{ padding: "7px 16px", borderRadius: 999, border: "1px solid #eee", background: editPerms.includes(id) ? "var(--purple)" : "#F0EEE8", color: editPerms.includes(id) ? "#fff" : "#000" }}
                      >
                        {label}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => saveEdit(s.id)} style={btnPrimary}>حفظ الصلاحيات</button>
                </div>
              )}
            </div>
          ))}
          {staff.length === 0 && <div style={{ color: "#888" }}>لا يوجد موظفون بعد.</div>}
        </div>
      )}
    </div>
  );
}

function NotificationBell({ dark }) {
  const { user } = useAuth();
  const { data: notifs } = useQuery("notifications", "userId", "==", user ? user.uid : null);
  const [open, setOpen] = useState(false);
  const sorted = [...notifs].sort((a, b) => (b.createdAt && a.createdAt ? b.createdAt.toMillis() - a.createdAt.toMillis() : 0));

/* ============================= Shared: live GPS tracking map ============================= */
function LiveTrackingMap({ repId }) {
  const rep = useDoc("users", repId);
  const mapRef = React.useRef(null);
  const leafletMapRef = React.useRef(null);
  const markerRef = React.useRef(null);

  useEffect(() => {
    if (!mapRef.current || leafletMapRef.current) return;
    leafletMapRef.current = L.map(mapRef.current).setView([33.5138, 36.2765], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(leafletMapRef.current);
  }, []);

  useEffect(() => {
    if (!leafletMapRef.current || !rep || !rep.location) return;
    const { lat, lng } = rep.location;
    leafletMapRef.current.setView([lat, lng], 15);
    if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
    else markerRef.current = L.marker([lat, lng]).addTo(leafletMapRef.current).bindPopup("موقع المندوب الحالي");
  }, [rep]);

  return (
    <div>
      <div ref={mapRef} style={{ width: "100%", height: 220, borderRadius: 12, overflow: "hidden", border: "1px solid #eee" }}></div>
      {!(rep && rep.location) && <div style={{ fontSize: 12, color: "#888", marginTop: 6 }}>بانتظار المندوب يفعّل مشاركة موقعه…</div>}
    </div>
  );
}

/* ============================= Cases (متابعة وحل القصص) ============================= */
function CaseChat({ caseId }) {
  const { user, profile } = useAuth();
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState("");
  useEffect(() => {
    const unsub = db.collection("cases").doc(caseId).collection("messages").orderBy("createdAt").onSnapshot(
      (snap) => setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {}
    );
    return unsub;
  }, [caseId]);
  const send = async () => {
    if (!text.trim()) return;
    await db.collection("cases").doc(caseId).collection("messages").add({
      senderId: user.uid, senderName: (profile && profile.name) || "", senderRole: (profile && profile.role) || "",
      text: text.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await db.collection("cases").doc(caseId).update({ updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    setText("");
  };
  return (
    <div>
      <div style={{ maxHeight: 260, overflow: "auto", display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
        {messages.map((m) => (
          <div key={m.id} style={{ alignSelf: m.senderId === user.uid ? "flex-end" : "flex-start", background: m.senderId === user.uid ? "var(--purple)" : "#F0EEE8", color: m.senderId === user.uid ? "#fff" : "#000", borderRadius: 12, padding: "8px 12px", maxWidth: "80%" }}>
            <div style={{ fontSize: 11, opacity: .8, marginBottom: 2 }}>{m.senderName}</div>
            <div style={{ fontSize: 14 }}>{m.text}</div>
          </div>
        ))}
        {messages.length === 0 && <div style={{ color: "#888", fontSize: 13 }}>ما في رسائل بعد.</div>}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input style={{ ...inputStyle, flex: 1 }} placeholder="اكتب رسالة…" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        <button onClick={send} style={btnPrimary}>إرسال</button>
      </div>
    </div>
  );
}

/* ============================= Admin: manage other full admins ============================= */
function AdminsAdmin() {
  const { createManagedAccount, user: currentUser } = useAuth();
  const [, , t] = useLanguage();
  const { data: allUsers, loading } = useCollection("users");
  const admins = allUsers.filter((u) => u.role === "admin");
  const [form, setForm] = useState({ name: "", phone: "", email: "" });
  const [createdInfo, setCreatedInfo] = useState(null);
  const [busy, setBusy] = useState(false);
  const create = async () => {
    setCreatedInfo(null);
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) { setCreatedInfo({ error: "عبّي كل الحقول." }); return; }
    if (!isValidPhone(form.phone)) { setCreatedInfo({ error: "رقم الهاتف غير صحيح." }); return; }
    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({ email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "admin" });
      logAudit("إنشاء حساب أدمن جديد", form.name.trim() + " (" + form.email.trim() + ")");
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "" });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };
  const removeAdmin = async (a) => {
    if (a.id === currentUser.uid) { alert("ما فيك تحذف حسابك الخاص."); return; }
    if (!window.confirm("متأكد بدك تحذف صلاحية الأدمن الكاملة عن \"" + a.name + "\"؟")) return;
    await db.collection("users").doc(a.id).delete();
    logAudit("حذف حساب أدمن", a.name + " (" + a.email + ")");
  };
  return (
    <div style={{ padding: 20 }}>
      <h2>إضافة أدمن كامل الصلاحيات</h2>
      <p style={{ color: "#888", fontSize: 13 }}>⚠️ الأدمن الكامل يقدر يشوف ويعدّل كل شي بالمنصة، بلا استثناء — استخدم هاد بحذر وبس لأشخاص موثوقين تماماً.</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder={t("nameLabel")} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input style={inputStyle} placeholder={t("phoneLabel")} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        <input style={inputStyle} placeholder={t("emailLabel")} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
      </div>
      <button onClick={create} disabled={busy} style={btnPrimary}>{busy ? t("creating") : "إنشاء حساب أدمن"}</button>
      {createdInfo && !createdInfo.error && (
        <div style={{ background: "#EBF5EF", border: "1px solid #22B573", borderRadius: 10, padding: 14, marginTop: 14 }}>
          الإيميل: <strong>{createdInfo.email}</strong> / كلمة المرور: <strong>{createdInfo.password}</strong>
        </div>
      )}
      {createdInfo && createdInfo.error && <div style={{ color: "red", marginTop: 10 }}>{createdInfo.error}</div>}
      <h2 style={{ marginTop: 32 }}>المدراء الحاليون</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {admins.map((a) => (
            <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
              <div>
                <strong>{a.name}</strong>{a.id === currentUser.uid && <span style={{ color: "#888", fontSize: 12 }}> (أنت)</span>}
                <div style={{ color: "#888", fontSize: 13 }}>{a.email} — {a.phone}</div>
              </div>
              {a.id !== currentUser.uid && <button onClick={() => removeAdmin(a)} style={btnDanger}>حذف</button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminReports() {
  const { data: orders, loading: ordersLoading } = useCollection("orders");
  const { data: users, loading: usersLoading } = useCollection("users");
  const delivered = orders.filter((o) => o.status === "delivered");
  const totalRevenue = delivered.reduce((s, o) => s + (o.total || 0), 0);
  const byStatus = {};
  orders.forEach((o) => { byStatus[o.status] = (byStatus[o.status] || 0) + 1; });
  const merchantRevenue = {};
  delivered.forEach((o) => o.items.forEach((it) => { merchantRevenue[it.merchantId] = (merchantRevenue[it.merchantId] || { name: "", total: 0 }); merchantRevenue[it.merchantId].total += it.price * it.qty; }));
  const merchantsById = {}; users.forEach((u) => { merchantsById[u.id] = u.name; });
  const topMerchants = Object.entries(merchantRevenue).map(([id, v]) => [merchantsById[id] || id, v.total]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const roleCounts = {};
  users.forEach((u) => { roleCounts[u.role] = (roleCounts[u.role] || 0) + 1; });
  const maxMerchantRev = topMerchants.length ? topMerchants[0][1] : 1;
  const loading = ordersLoading || usersLoading;
  return (
    <div style={{ padding: 20 }}>
      <h2>تقارير المنصة</h2>
      {loading ? <Loading /> : (
        <React.Fragment>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
            <div style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 16, minWidth: 150 }}>
              <div style={{ color: "#888", fontSize: 12 }}>إجمالي الإيرادات (طلبات مسلّمة)</div>
              <div style={{ fontWeight: 800, fontSize: 22, color: "#9B3FE8" }}>{totalRevenue}</div>
            </div>
            <div style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 16, minWidth: 150 }}>
              <div style={{ color: "#888", fontSize: 12 }}>إجمالي الطلبات</div>
              <div style={{ fontWeight: 800, fontSize: 22 }}>{orders.length}</div>
            </div>
            <div style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 16, minWidth: 150 }}>
              <div style={{ color: "#888", fontSize: 12 }}>عدد المستخدمين</div>
              <div style={{ fontWeight: 800, fontSize: 22 }}>{users.length}</div>
            </div>
          </div>
          <h3>الطلبات حسب الحالة</h3>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 24 }}>
            {Object.entries(byStatus).map(([status, count]) => (
              <div key={status} style={{ background: "#F0EEE8", borderRadius: 999, padding: "6px 14px", fontSize: 13 }}><StatusTag status={status} /> × {count}</div>
            ))}
          </div>
          <h3>المستخدمون حسب الدور</h3>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 24, fontSize: 13, color: "#666" }}>
            {Object.entries(roleCounts).map(([role, count]) => <span key={role}>{role}: {count}</span>)}
          </div>
          <h3>أفضل التجار (حسب الإيرادات المسلّمة)</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {topMerchants.map(([name, total]) => (
              <div key={name}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}><span>{name}</span><span>{total}</span></div>
                <div style={{ background: "#eee", borderRadius: 999, height: 8 }}>
                  <div style={{ width: (total / maxMerchantRev * 100) + "%", background: "var(--purple)", height: 8, borderRadius: 999 }}></div>
                </div>
              </div>
            ))}
            {topMerchants.length === 0 && <div style={{ color: "#888" }}>لا يوجد بيانات بعد.</div>}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ============================= Admin: returns/exchange requests ============================= */
function ReturnsAdmin() {
  const { data: returns, loading } = useCollection("returns");
  const sorted = [...returns].reverse();
  const setStatus = (r, status) => {
    db.collection("returns").doc(r.id).update({ status });
    logAudit("تحديث طلب إرجاع", r.itemName + " → " + status);
    notifyUser(r.customerId, status === "approved" ? "تم قبول طلب الإرجاع" : "تم رفض طلب الإرجاع", r.itemName);
  };
  const map = { pending: ["قيد المراجعة", "#B58A2A"], approved: ["مقبول", "#1F7A4C"], rejected: ["مرفوض", "#B23A3A"] };
  return (
    <div style={{ padding: 20 }}>
      <h2>طلبات الإرجاع والاستبدال</h2>
      {loading ? <Loading /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {sorted.map((r) => (
            <div key={r.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <strong>{r.itemName}</strong>
                <span style={{ color: (map[r.status] || ["", "#888"])[1], fontSize: 12 }}>{(map[r.status] || [r.status])[0]}</span>
              </div>
              <div style={{ color: "#888", fontSize: 13 }}>الزبون: {r.customerName} — طلب #{r.orderId.slice(-5)}</div>
              {r.reason && <div style={{ fontSize: 13, color: "#666", marginTop: 4 }}>السبب: {r.reason}</div>}
              {r.status === "pending" && (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button onClick={() => setStatus(r, "approved")} style={btnPrimary}>قبول</button>
                  <button onClick={() => setStatus(r, "rejected")} style={btnDanger}>رفض</button>
                </div>
              )}
            </div>
          ))}
          {sorted.length === 0 && <div style={{ color: "#888" }}>لا يوجد طلبات إرجاع.</div>}
        </div>
      )}
    </div>
  );
}

/* ============================= Admin: backup / export ============================= */
function BackupAdmin() {
  const [busy, setBusy] = useState(false);
  const exportAll = async () => {
    setBusy(true);
    try {
      const collections = ["users", "products", "orders", "categories", "coupons", "returns"];
      const result = {};
      for (const name of collections) {
        const snap = await db.collection(name).get();
        result[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      }
      const blob = new Blob([JSON.stringify(result, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "we-in-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
      logAudit("تصدير نسخة احتياطية", "");
    } finally { setBusy(false); }
  };
  return (
    <div style={{ padding: 20, maxWidth: 420 }}>
      <h2>نسخة احتياطية</h2>
      <p style={{ color: "#888", fontSize: 13 }}>بيصدّر ملف JSON فيه كل البيانات (المستخدمين، المنتجات، الطلبات، الفئات، الكوبونات، طلبات الإرجاع) لجهازك مباشرة. خزّنه بمكان آمن، ونفّذها بشكل دوري (مثلاً أسبوعياً).</p>
      <button onClick={exportAll} disabled={busy} style={btnPrimary}>{busy ? "جارِ التصدير…" : "⬇️ تصدير نسخة احتياطية الآن"}</button>
    </div>
  );
}

/* ============================= Admin dashboard shell ============================= */
function ChangePasswordPanel() {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [msg, setMsg] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError(""); setMsg("");
    if (next.trim().length < 8) { setError("كلمة المرور الجديدة لازم تكون 8 أحرف/أرقام على الأقل."); return; }
    setBusy(true);
    try {
      // Firebase requires a recent login for sensitive actions like changing
      // a password — re-authenticating with the current password first
      // avoids a confusing "requires-recent-login" error.
      const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, current);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(next.trim());
      setMsg("تم تغيير كلمة المرور بنجاح.");
      setCurrent(""); setNext("");
    } catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };

  return (
    <div style={{ padding: 20, maxWidth: 380 }}>
      <h2>تغيير كلمة المرور</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <input type="password" style={inputStyle} placeholder="كلمة المرور الحالية" value={current} onChange={(e) => setCurrent(e.target.value)} />
        <input type="password" style={inputStyle} placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)" value={next} onChange={(e) => setNext(e.target.value)} />
        {error && <div style={{ color: "red", fontSize: 13 }}>{error}</div>}
        {msg && <div style={{ color: "#22B573", fontSize: 13 }}>{msg}</div>}
        <button onClick={submit} disabled={busy} style={btnPrimary}>{busy ? "جارِ الحفظ…" : "حفظ كلمة المرور الجديدة"}</button>
      </div>
    </div>
  );
}
