(function () {
  function showError(text) {
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B23A3A;color:#fff;padding:14px;font-family:monospace;font-size:12px;z-index:99999;direction:ltr;text-align:left;white-space:pre-wrap;max-height:50vh;overflow:auto;";
    el.textContent = text;
    var target = document.body || document.documentElement;
    try {
      target.appendChild(el);
    } catch (appendErr) {
      // If even this fails (extremely early script error), fall back to an alert
      // so the person still sees *something* instead of a silent blank page.
      alert(text);
    }
  }
  window.addEventListener(
    "error",
    function (e) {
      var msg = e.message ? e.message : "Resource failed to load: " + (e.target && (e.target.src || e.target.href));
      showError("JS Error: " + msg + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
    },
    true
  );
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
    showError("Promise Error: " + reason);
  });
})();
</script>

const { useState, useEffect, useContext, createContext } = React;

const mainApp = firebase.initializeApp(firebaseConfig);

/* ============================= Auth context ============================= */
const AuthContext = createContext(null);
function useAuth() { return useContext(AuthContext); }

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const ref = db.collection("users").doc(u.uid);
        let snap = await ref.get();
        if (!snap.exists) {
          await ref.set({
            name: u.displayName || "",
            email: u.email || "",
            phone: null,
            role: "customer",
            wishlist: [],
            addresses: [],
            points: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          snap = await ref.get();
        }
        setProfile({ id: u.uid, ...snap.data() });
      } else {
        setProfile(null);
      }
      setLoading(false);
    });
    return unsub;
  }, []);

  async function refreshProfile() {
    if (!auth.currentUser) return;
    const snap = await db.collection("users").doc(auth.currentUser.uid).get();
    setProfile(snap.exists ? { id: auth.currentUser.uid, ...snap.data() } : null);
  }

  async function signup({ email, password, name }) {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await cred.user.sendEmailVerification();
    await db.collection("users").doc(cred.user.uid).set({
      name, email, phone: null, role: "customer", wishlist: [], addresses: [], points: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return cred.user;
  }

  async function login({ email, password }) {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    return cred.user;
  }

  async function socialSignIn(providerName) {
    const provider = providerName === "google" ? new firebase.auth.GoogleAuthProvider() : new firebase.auth.FacebookAuthProvider();
    const cred = await auth.signInWithPopup(provider);
    return cred.user;
  }
  const loginWithGoogle = () => socialSignIn("google");
  const loginWithFacebook = () => socialSignIn("facebook");

  async function setMyPhone(phone) {
    if (!auth.currentUser) return;
    await db.collection("users").doc(auth.currentUser.uid).update({ phone });
    await refreshProfile();
  }

  async function logout() { await auth.signOut(); }
  async function resendVerification() { if (auth.currentUser) await auth.currentUser.sendEmailVerification(); }

  // Creates merchant/delivery/staff accounts without logging the admin out —
  // uses a throwaway secondary Firebase app instance for the creation call.
  async function createManagedAccount({ email, password, name, role, phone, extra = {} }) {
    const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary-" + Date.now());
    try {
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(cred.user.uid).set({
        name, email, phone: phone || null, role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        ...extra,
      });
      return cred.user.uid;
    } finally {
      await secondaryApp.auth().signOut().catch(() => {});
      await secondaryApp.delete().catch(() => {});
    }
  }

  const value = { user, profile, loading, signup, login, loginWithGoogle, loginWithFacebook, setMyPhone, logout, resendVerification, createManagedAccount };
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}

/* ============================= Firestore hooks ============================= */
function useCollection(name, orderByField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let ref = db.collection(name);
    if (orderByField) ref = ref.orderBy(orderByField);
    const unsub = ref.onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, orderByField]);
  return { data, loading };
}

function useQuery(name, field, op, value) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (value === undefined || value === null) { setData([]); setLoading(false); return; }
    const unsub = db.collection(name).where(field, op, value).onSnapshot(
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoading(false); },
      (err) => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [name, field, op, value]);
  return { data, loading };
}

/* ============================= Helpers ============================= */
const isValidPhone = (phone) => /^09\d{8}$/.test((phone || "").trim()) && !/^(\d)\1{9}$/.test((phone || "").trim());
function genPassword() { return String(Math.floor(10000000 + Math.random() * 90000000)); }
function firebaseErrorToArabic(err) {
  const code = (err && err.code) || "";
  if (code.includes("email-already-in-use")) return "هذا الإيميل مسجّل/مستخدم مسبقاً.";
  if (code.includes("invalid-email")) return "صيغة الإيميل غير صحيحة.";
  if (code.includes("weak-password")) return "كلمة المرور ضعيفة جداً.";
  if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential")) return "الإيميل أو كلمة المرور غير صحيحة.";
  if (code.includes("too-many-requests")) return "محاولات كتير، جرب بعد شوي.";
  return "صار خطأ: " + ((err && err.message) || "غير معروف");
}
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 900; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("تعذّر تحميل الصورة"));
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

}

/* ============================= Login screen ============================= */
function LoginScreen() {
  const { signup, login, loginWithGoogle, loginWithFacebook } = useAuth();
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [signedUp, setSignedUp] = useState(false);
  const isValidPassword = (pw) => pw.trim().length >= 8;

  const wrapStyle = {
    minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
    background: "radial-gradient(circle at 22% 12%, rgba(155,63,232,.28) 0%, transparent 40%), radial-gradient(circle at 85% 88%, rgba(155,63,232,.16) 0%, transparent 45%), #0A0A0B",
    padding: 20,
  };
  const cardStyle = { background: "#fff", borderRadius: 22, padding: 30, width: "100%", maxWidth: 420, boxShadow: "0 25px 70px rgba(0,0,0,.45)" };

  const handleSocial = async (fn) => {
    setError(""); setBusy(true);
    try { await fn(); } catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };
  const handleSignup = async (e) => {
    e.preventDefault(); setError("");
    if (!name.trim() || !email.trim() || !password.trim()) { setError("عبّي كل الحقول."); return; }
    if (!isValidPassword(password)) { setError("كلمة المرور لازم تكون 8 أحرف/أرقام على الأقل."); return; }
    setBusy(true);
    try { await signup({ email: email.trim(), password, name: name.trim() }); setSignedUp(true); }
    catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };
  const handleLogin = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    try { await login({ email: email.trim(), password }); }
    catch (err) { setError(firebaseErrorToArabic(err)); } finally { setBusy(false); }
  };

  if (signedUp) {
    return (
      <div style={wrapStyle}>
        <div style={cardStyle}>
          <h2>تم إنشاء حسابك 🎉</h2>
          <p>بعتنالك رسالة تفعيل حقيقية عبإيميلك (<strong>{email}</strong>). افتح بريدك واضغط رابط التفعيل، وبعدين ارجع سجل دخول من هون.</p>
          <button style={btnPrimary} onClick={() => setSignedUp(false)}>رجوع لتسجيل الدخول</button>
        </div>
      </div>
    );
  }

  return (
    <div style={wrapStyle}>
      <div style={cardStyle} className="fade-in">
        <h1 style={{ textAlign: "center", fontWeight: 900 }}>We<span style={{ color: "var(--purple)" }}>-in</span></h1>
        <div style={{ display: "flex", gap: 6, marginBottom: 20, background: "#F0EEE8", borderRadius: 11, padding: 4 }}>
          <button style={{ flex: 1, padding: 10, borderRadius: 8, border: "none", background: mode === "login" ? "var(--purple)" : "transparent", color: mode === "login" ? "#fff" : "#000" }} onClick={() => setMode("login")}>تسجيل الدخول</button>
          <button style={{ flex: 1, padding: 10, borderRadius: 8, border: "none", background: mode === "signup" ? "var(--purple)" : "transparent", color: mode === "signup" ? "#fff" : "#000" }} onClick={() => setMode("signup")}>حساب جديد (عملاء)</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          <button type="button" style={{ background: "#fff", color: "#000", border: "1.5px solid #000", borderRadius: 999, padding: 12, fontWeight: 700 }} onClick={() => handleSocial(loginWithGoogle)} disabled={busy}>المتابعة عبر Google</button>
          <button type="button" style={{ background: "#fff", color: "#000", border: "1.5px solid #000", borderRadius: 999, padding: 12, fontWeight: 700 }} onClick={() => handleSocial(loginWithFacebook)} disabled={busy}>المتابعة عبر Facebook</button>
        </div>
        <div style={{ textAlign: "center", color: "#999", fontSize: 12, marginBottom: 14 }}>أو</div>
        <form onSubmit={mode === "login" ? handleLogin : handleSignup} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {mode === "signup" && (
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>الاسم الكامل
              <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} />
            </label>
          )}
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>البريد الإلكتروني
            <input type="email" style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} />
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>كلمة المرور {mode === "signup" && "(8 أحرف/أرقام على الأقل)"}

          </label>
          {error && <div style={{ color: "#FF4D4D", fontSize: 13 }}>{error}</div>}
          <button type="submit" style={btnPrimary} disabled={busy}>{busy ? "جارِ التنفيذ…" : mode === "login" ? "دخول" : "إنشاء الحساب"}</button>
        </form>
      </div>
    </div>
  );
}

function RequirePhoneGate({ onSubmit, onLogout }) {
  const [phone, setPhone] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setError("");
    if (!isValidPhone(phone)) { setError("رقم الهاتف غير صحيح. لازم يبدأ بـ 09 ويتكوّن من 10 أرقام (مثال: 0912345678)."); return; }
    setBusy(true);
    try { await onSubmit(phone.trim()); } finally { setBusy(false); }
  };
  return (
    <FullscreenMessage title="خطوة أخيرة" subtitle="لازم رقم هاتف حقيقي على حسابك، حتى لو دخلت عبر Google أو Facebook — التوصيل بحاجته.">
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 320 }}>
        <input style={{ padding: "12px 14px", borderRadius: 9, border: "1px solid #ccc", textAlign: "center" }} placeholder="09xxxxxxxx" value={phone} onChange={(e) => setPhone(e.target.value)} />
        {error && <div style={{ color: "#FF4D4D", fontSize: 13 }}>{error}</div>}
        <button type="submit" style={btnPrimary} disabled={busy}>{busy ? "جارِ الحفظ…" : "متابعة"}</button>
        <button type="button" style={btnGhost} onClick={onLogout}>تسجيل الخروج</button>
      </form>
    </FullscreenMessage>
  );
}

/* ============================= Admin: Categories ============================= */
function CategoriesAdmin() {
  const { data: categories, loading } = useCollection("categories", "name");
  const [name, setName] = useState("");
  const [error, setError] = useState("");
  const add = async () => {
    setError(""); if (!name.trim()) return;
    try { await db.collection("categories").add({ name: name.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp() }); setName(""); }
    catch (err) { setError("تعذّر الحفظ: " + err.message); }
  };
  const remove = async (id) => {
    try { await db.collection("categories").doc(id).delete(); } catch (err) { setError("تعذّر الحذف: " + err.message); }
  };
  return (
    <div style={{ padding: 20 }}>
      <h2>الفئات</h2>
      <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
        <input style={{ ...inputStyle, flex: 1 }} placeholder="اسم فئة جديدة" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
        <button onClick={add} style={btnPrimary}>إضافة فئة</button>
      </div>
      {error && <div style={{ color: "red", marginBottom: 12 }}>{error}</div>}
      {loading ? <div>جارِ التحميل…</div> : (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {categories.map((c) => (
            <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 6, background: "#F0EEE8", borderRadius: 999, padding: "6px 14px" }}>
              {c.name}
              <button onClick={() => remove(c.id)} style={{ border: "none", background: "transparent", color: "red", fontSize: 16 }}>×</button>
            </div>
          ))}
          {categories.length === 0 && <div style={{ color: "#888" }}>لا يوجد فئات بعد.</div>}
        </div>
      )}
    </div>
  );
}

function DeliveryAdmin() {
  const { createManagedAccount } = useAuth();
  const { data: allUsers, loading } = useCollection("users");
  const reps = allUsers.filter((u) => u.role === "delivery");
  const [form, setForm] = useState({ name: "", phone: "", email: "" });
  const [createdInfo, setCreatedInfo] = useState(null);
  const [busy, setBusy] = useState(false);

  const create = async () => {
    setCreatedInfo(null);
    if (!form.name.trim() || !form.phone.trim() || !form.email.trim()) { setCreatedInfo({ error: "عبّي كل الحقول." }); return; }
    if (!isValidPhone(form.phone)) { setCreatedInfo({ error: "رقم الهاتف غير صحيح." }); return; }
    setBusy(true);
    const password = genPassword();
    try {
      await createManagedAccount({ email: form.email.trim(), password, name: form.name.trim(), phone: form.phone.trim(), role: "delivery", extra: { status: "active" } });
      setCreatedInfo({ email: form.email.trim(), password });
      setForm({ name: "", phone: "", email: "" });
    } catch (err) { setCreatedInfo({ error: firebaseErrorToArabic(err) }); } finally { setBusy(false); }
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>إضافة مندوب توصيل</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>

        <input style={inputStyle} placeholder="الإيميل" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
      </div>
      <button onClick={create} disabled={busy} style={btnPrimary}>{busy ? "جارِ الإنشاء…" : "إنشاء حساب المندوب"}</button>

/* ============================= Merchant dashboard ============================= */
function MerchantProducts() {
  const { user, profile } = useAuth();
  const { data: products, loading } = useQuery("products", "merchantId", "==", user ? user.uid : null);
  const { data: categories } = useCollection("categories", "name");
  const [form, setForm] = useState({ name: "", price: "", stock: "", categoryId: "", image: "", description: "" });
  const [error, setError] = useState("");
  const [uploading, setUploading] = useState(false);

  const handleImageFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploading(true); setError("");
    try {
      const compressed = await compressImageFile(file);
      const path = "products/" + user.uid + "/" + Date.now() + ".jpg";
      const storageRef = storage.ref(path);
      await storageRef.put(compressed);
      const url = await storageRef.getDownloadURL();
      setForm((f) => ({ ...f, image: url }));
    } catch (err) { setError("تعذّر رفع الصورة: " + err.message); } finally { setUploading(false); }
  };

  const add = async () => {
    setError(""); if (!form.name.trim() || !form.price) return;
    try {
      await db.collection("products").add({
        name: form.name.trim(), price: Number(form.price), currency: (profile && profile.currency) || "SYP",
        stock: Number(form.stock) || 0, categoryId: form.categoryId, image: form.image, description: form.description.trim(),
        merchantId: user.uid, merchantName: (profile && profile.name) || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setForm({ name: "", price: "", stock: "", categoryId: "", image: "", description: "" });
    } catch (err) { setError("تعذّر الحفظ: " + err.message); }
  };
  const remove = async (id) => { await db.collection("products").doc(id).delete(); };

  return (
    <div style={{ padding: 20 }}>
      <h2>إضافة منتج</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="اسم المنتج" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        <input type="number" style={inputStyle} placeholder="السعر" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
        <input type="number" style={inputStyle} placeholder="الكمية" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} />
        <select style={inputStyle} value={form.categoryId} onChange={(e) => setForm({ ...form, categoryId: e.target.value })}>
          <option value="">اختر فئة</option>
          {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
        {form.image && <img src={form.image} alt="" style={{ width: 60, height: 60, borderRadius: 8, objectFit: "cover", border: "1px solid #ddd" }} />}
        <div>
          <input type="file" accept="image/*" onChange={handleImageFile} />
          {uploading && <div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>جارِ رفع الصورة…</div>}
        </div>
      </div>
      <textarea style={{ ...inputStyle, width: "100%", minHeight: 60, marginBottom: 12 }} placeholder="الوصف" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
      <br />
      <button onClick={add} style={btnPrimary}>نشر المنتج</button>
      {error && <div style={{ color: "red", marginTop: 10 }}>{error}</div>}
      <h2 style={{ marginTop: 32 }}>منتجاتي ({products.length})</h2>
      {loading ? <div>جارِ التحميل…</div> : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px,1fr))", gap: 14 }}>
          {products.map((p) => (
            <div key={p.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, overflow: "hidden" }}>
              <div style={{ height: 110, background: "#f4f4f4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "#999", fontSize: 12 }}>لا صورة</span>}
              </div>
              <div style={{ padding: 10 }}>
                <div style={{ fontWeight: 700 }}>{p.name}</div>
                <div style={{ color: "#9B3FE8", fontWeight: 700 }}>{p.price} {p.currency}</div>
                <button onClick={() => remove(p.id)} style={{ border: "none", background: "transparent", color: "red", fontSize: 13, padding: 0, marginTop: 6 }}>حذف</button>
              </div>
            </div>
          ))}
          {products.length === 0 && <div style={{ color: "#888" }}>لا يوجد منتجات بعد.</div>}
        </div>
      )}
    </div>
  );
}

function CartView({ cart, onUpdateQty, onPlaced, onBack }) {
  const { user, profile } = useAuth();
  const [address, setAddress] = useState("");
  const [paymentNote, setPaymentNote] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

  const place = async () => {
    setError("");
    if (cart.length === 0) { setError("السلة فارغة."); return; }
    if (!address.trim()) { setError("عبّي عنوان التوصيل."); return; }
    setBusy(true);
    try {
      const merchantIds = [...new Set(cart.map((c) => c.merchantId))];
      await db.collection("orders").add({
        customerId: user.uid, customerName: (profile && profile.name) || "", customerPhone: (profile && profile.phone) || "",
        items: cart, merchantIds, total, address: address.trim(), paymentNote: paymentNote.trim(),
        status: "awaiting_payment_review", deliveryRepId: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      onPlaced();
    } catch (err) { setError("تعذّر إرسال الطلب: " + err.message); } finally { setBusy(false); }
  };

  return (
    <div style={{ padding: 20 }}>
      <h2>السلة</h2>
      {cart.map((c) => (
        <div key={c.productId} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff", border: "1px solid #eee", borderRadius: 10, padding: 12, marginBottom: 8 }}>
          <div>
            <div style={{ fontWeight: 700 }}>{c.name}</div>
            <div style={{ color: "#888", fontSize: 13 }}>{c.price} {c.currency}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => onUpdateQty(c.productId, c.qty - 1)}>−</button>
            <span>{c.qty}</span>
            <button onClick={() => onUpdateQty(c.productId, c.qty + 1)}>+</button>
          </div>
        </div>
      ))}
      {cart.length === 0 && <div style={{ color: "#888" }}>السلة فارغة.</div>}
      {cart.length > 0 && (
        <React.Fragment>
          <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, marginTop: 10, marginBottom: 16 }}>
            <span>الإجمالي</span><span>{total}</span>
          </div>
          <input style={{ ...inputStyle, width: "100%" }} placeholder="عنوان التوصيل" value={address} onChange={(e) => setAddress(e.target.value)} />
          <input style={{ ...inputStyle, width: "100%", marginTop: 8 }} placeholder="ملاحظة دفع (اختياري)" value={paymentNote} onChange={(e) => setPaymentNote(e.target.value)} />
          {error && <div style={{ color: "red", marginTop: 8 }}>{error}</div>}
          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button onClick={onBack} style={btnGhost}>رجوع</button>
            <button onClick={place} disabled={busy} style={btnPrimary}>{busy ? "جارِ الإرسال…" : "تأكيد الطلب"}</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function MyOrders() {
  const { user } = useAuth();
  const { data: orders, loading } = useQuery("orders", "customerId", "==", user ? user.uid : null);
  return (
    <div style={{ padding: 20 }}>
      <h2>طلباتي</h2>
      {loading ? <div>جارِ التحميل…</div> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[...orders].reverse().map((o) => (
            <div key={o.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <strong>طلب #{o.id.slice(-5)}</strong>
                <StatusTag status={o.status} />
              </div>
              {o.items.map((it, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span>{it.name} × {it.qty}</span><span>{it.price * it.qty}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, borderTop: "1px solid #eee", paddingTop: 6, marginTop: 6 }}>
                <span>الإجمالي</span><span>{o.total}</span>
              </div>
            </div>
          ))}
          {orders.length === 0 && <div style={{ color: "#888" }}>لا يوجد طلبات بعد.</div>}
        </div>
      )}
    </div>
  );
}

function CustomerApp() {
  const { profile, logout } = useAuth();
  const [view, setView] = useState("shop");
  const [cart, setCart] = useState([]);
  const addToCart = (product) => {
    setCart((prev) => {
      const existing = prev.find((c) => c.productId === product.id);
      if (existing) return prev.map((c) => (c.productId === product.id ? { ...c, qty: c.qty + 1 } : c));
      return [...prev, { productId: product.id, name: product.name, price: product.price, currency: product.currency || "SYP", merchantId: product.merchantId, qty: 1 }];
    });
  };
  const updateQty = (productId, qty) => {
    setCart((prev) => (qty <= 0 ? prev.filter((c) => c.productId !== productId) : prev.map((c) => (c.productId === productId ? { ...c, qty } : c))));
  };
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);
  const navBtn = (active) => ({ padding: "8px 16px", borderRadius: 999, border: "1px solid #eee", background: active ? "#000" : "#fff", color: active ? "#fff" : "#000" });

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 20px", background: "#fff", borderBottom: "1px solid #eee" }}>
        <div style={{ fontWeight: 800 }}>أهلاً {profile && profile.name}</div>
        <button onClick={logout} style={{ border: "1px solid #000", background: "transparent", borderRadius: 999, padding: "6px 14px" }}>خروج</button>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 20px", background: "#fff" }}>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setView("shop")} style={navBtn(view === "shop")}>المتجر</button>
          <button onClick={() => setView("orders")} style={navBtn(view === "orders")}>طلباتي</button>
        </div>
        <button className="cart-pulse" onClick={() => setView("cart")} style={{ background: "#9B3FE8", color: "#fff", border: "none", borderRadius: 999, padding: "8px 18px", fontWeight: 700 }}>🛒 السلة ({cartCount})</button>
      </div>
      {view === "shop" && <Storefront onAdd={addToCart} />}
      {view === "cart" && <CartView cart={cart} onUpdateQty={updateQty} onPlaced={() => { setCart([]); setView("orders"); }} onBack={() => setView("shop")} />}
      {view === "orders" && <MyOrders />}
    </div>
  );
}

/* ============================= Delivery dashboard ============================= */
function DeliveryDashboard() {
  const { user, profile, logout } = useAuth();
  const { data: orders, loading } = useQuery("orders", "deliveryRepId", "==", user ? user.uid : null);
  const myOrders = orders.filter((o) => o.status === "out_for_delivery" || o.status === "delivered");
  const markDelivered = (id) => db.collection("orders").doc(id).update({ status: "delivered" });

  return (
    <div style={{ minHeight: "100vh", background: "#F2F1EC" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", background: "#000", color: "#fff" }}>
        <div style={{ fontWeight: 800 }}>{profile && profile.name} — واجهة المندوب</div>
        <button onClick={logout} style={{ background: "transparent", border: "1px solid rgba(255,255,255,.3)", color: "#fff", borderRadius: 999, padding: "6px 16px" }}>تسجيل الخروج</button>
      </div>
      <div style={{ padding: 20 }}>
        <h2>طلباتي</h2>
        {loading ? <div>جارِ التحميل…</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {myOrders.map((o) => (
              <div key={o.id} className="lift" style={{ background: "#fff", border: "1px solid #eee", borderRadius: 12, padding: 14 }}>
                <div style={{ fontWeight: 700 }}>طلب #{o.id.slice(-5)}</div>
                <div style={{ color: "#888", fontSize: 13 }}>{o.customerName} — {o.customerPhone}</div>
                <div style={{ color: "#888", fontSize: 13 }}>العنوان: {o.address}</div>
                <div style={{ fontWeight: 700, marginTop: 6 }}>الإجمالي: {o.total}</div>
                {o.status === "out_for_delivery" && <button onClick={() => markDelivered(o.id)} style={{ marginTop: 10, ...btnPrimary }}>تم التسليم</button>}
                {o.status === "delivered" && <span style={{ color: "#1F7A4C" }}>تم التسليم ✓</span>}
              </div>
            ))}
            {myOrders.length === 0 && <div style={{ color: "#888" }}>لا يوجد طلبات مسندة إليك.</div>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================= App root ============================= */
function App() {
  const { user, profile, loading, logout, resendVerification, setMyPhone } = useAuth();
  if (loading) return <FullscreenMessage title="We-in" subtitle="جارِ التحميل…" />;
  if (!user) return <LoginScreen />;

  if (!user.emailVerified && profile && profile.role === "customer") {
    return (
      <FullscreenMessage title="أكّد إيميلك" subtitle={"بعتنالك رابط تفعيل حقيقي على " + user.email + ". افتحه وبعدين اضغط تحديث."}>
        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button onClick={() => window.location.reload()} style={btnPrimary}>تحديث الصفحة</button>
          <button onClick={resendVerification} style={btnGhost}>إعادة إرسال الرابط</button>
          <button onClick={logout} style={btnGhost}>تسجيل الخروج</button>
        </div>
      </FullscreenMessage>
    );
  }
  if (profile && !profile.phone) return <RequirePhoneGate onSubmit={setMyPhone} onLogout={logout} />;
  if (profile && profile.role === "admin") return <AdminDashboard onLogout={logout} />;
  if (profile && profile.role === "merchant") return <MerchantDashboard />;
  if (profile && profile.role === "delivery") return <DeliveryDashboard />;
  if (profile && profile.role === "customer") return <CustomerApp />;

  return (
    <FullscreenMessage title={"أهلاً " + ((profile && profile.name) || "")} subtitle={"دورك: " + ((profile && profile.role) || "غير محدد")}>
      <button onClick={logout} style={btnGhost}>تسجيل الخروج</button>
    </FullscreenMessage>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthProvider><App /></AuthProvider>);
</script>

<script>
  // We transform the JSX manually (instead of letting Babel Standalone
  // auto-scan <script type="text/babel"> tags) so we can force the
  // "classic" JSX runtime explicitly. Newer Babel defaults to the
  // "automatic" runtime, which injects `import { jsx as _jsx } from
  // "react/jsx-runtime"` into the compiled output — and since this isn't
  // loaded as an ES module, that import crashes the whole page with
  // "Cannot use import statement outside a module".
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    var script = document.createElement("script");
    script.text = output;
    document.body.appendChild(script);
  })();
</script>
